<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIHOT · 智能情报站</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --card: #131820; --border: #1e2736;
    --text: #c8d0e0; --dim: #6b7a99; --accent: #3b82f6;
    --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .header {
    border-bottom: 1px solid var(--border); padding: 20px 32px 12px;
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,14,20,.92); backdrop-filter: blur(12px);
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .header .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .header .status { font-size: 11px; color: var(--green); margin-left: 12px; }

  .tabs {
    display: flex; gap: 0; padding: 0 32px;
    border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .tabs button {
    background: none; border: none; color: var(--dim);
    font-size: 13px; padding: 10px 16px; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .2s;
    white-space: nowrap; font-family: inherit;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .badge { font-size: 10px; background: var(--accent); color: #fff; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }

  .main { max-width: 1400px; margin: 0 auto; padding: 20px 32px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 14px; transition: border-color .2s;
  }
  .card:hover { border-color: var(--accent); }
  .card h3 { font-size: 13px; font-weight: 500; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }

  /* Filters */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    padding: 12px; background: var(--card); border-radius: 8px; border: 1px solid var(--border);
  }
  .filters select, .filters input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: inherit;
  }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
  .filters label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 4px; }
  .filter-group { display: flex; align-items: center; gap: 4px; }

  /* Model/Entity Grid */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .entity-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; transition: all .2s;
  }
  .entity-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .entity-card .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .entity-card .name a { color: var(--text); text-decoration: none; }
  .entity-card .name a:hover { color: var(--accent); }
  .entity-card .vendor { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .entity-card .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: rgba(59,130,246,.15); color: var(--accent);
    border: 1px solid rgba(59,130,246,.25);
  }
  .tag.cn { background: rgba(34,197,94,.15); color: var(--green); border-color: rgba(34,197,94,.25); }
  .tag.special { background: rgba(245,158,11,.15); color: var(--orange); border-color: rgba(245,158,11,.25); }
  .entity-card .meta { font-size: 11px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
  .entity-card .meta span { display: flex; align-items: center; gap: 3px; }
  .entity-card .links { margin-top: 8px; display: flex; gap: 8px; }
  .entity-card .links a {
    font-size: 11px; color: var(--accent); text-decoration: none;
    padding: 2px 8px; border: 1px solid rgba(59,130,246,.3); border-radius: 4px;
  }
  .entity-card .links a:hover { background: rgba(59,130,246,.1); }
  .entity-card .status-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .status-production { background: rgba(34,197,94,.15); color: var(--green); }
  .status-preview { background: rgba(245,158,11,.15); color: var(--orange); }
  .status-prototype { background: rgba(239,68,68,.15); color: var(--red); }

  /* News section */
  .news-day {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .news-day .date { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
  .news-industry { margin-bottom: 12px; }
  .news-industry .ind-title {
    font-size: 12px; font-weight: 500; color: var(--orange);
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .news-industry .ind-title .count { font-weight: 400; color: var(--dim); }
  .news-item {
    padding: 6px 0; border-bottom: 1px solid rgba(30,39,54,.5); cursor: pointer;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item .title { font-size: 13px; margin-bottom: 2px; }
  .news-item .summary { font-size: 11px; color: var(--dim); display: none; }
  .news-item.expanded .summary { display: block; margin-top: 4px; }
  .news-item .spec-tag { font-size: 10px; background: rgba(245,158,11,.15); color: var(--orange); padding: 1px 5px; border-radius: 3px; margin-left: 6px; }

  /* Robot table */
  .robot-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  .robot-table th {
    background: var(--card); color: var(--dim); font-weight: 500;
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
    position: sticky; top: 120px; z-index: 50; cursor: pointer;
    white-space: nowrap;
  }
  .robot-table th:hover { color: var(--text); }
  .robot-table td { padding: 8px 10px; border-bottom: 1px solid rgba(30,39,54,.3); }
  .robot-table tr:hover td { background: rgba(59,130,246,.05); }
  .robot-table .cat-row td {
    background: rgba(30,39,54,.5); font-weight: 600; font-size: 11px;
    color: var(--accent); padding: 6px 10px; letter-spacing: .5px;
  }

  /* Skill recommendations */
  .skill-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .skill-card .name { font-size: 14px; font-weight: 600; color: var(--accent); }
  .skill-card .desc { font-size: 12px; color: var(--dim); margin: 4px 0; }
  .skill-card .reason { font-size: 11px; color: var(--text); margin-top: 4px; }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 24px; padding: 12px 0;
    font-size: 12px; color: var(--dim);
  }
  .stats-bar span { display: flex; align-items: center; gap: 4px; }
  .stats-bar .num { color: var(--text); font-weight: 600; }

  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 14px 16px 10px; }
    .tabs { padding: 0 16px; }
    .main { padding: 14px 16px; }
    .grid { grid-template-columns: 1fr; }
    .filters { flex-direction: column; }
    .robot-table { font-size: 10px; }
    .robot-table th, .robot-table td { padding: 4px 6px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>AI<span>HOT</span> · 智能情报站
    <span class="status" id="updateStatus">● 数据加载中...</span>
  </h1>
  <div class="sub">新闻联播 · 模型选型 · 机器人档案 · 技能推荐</div>
</div>

<div class="tabs" id="tabs">
  <button class="active" data-tab="news">📺 新闻</button>
  <button data-tab="models">🧠 模型选型</button>
  <button data-tab="robots">🤖 机器人档案</button>
  <button data-tab="skills">🛠 技能推荐</button>
</div>

<div class="main">

<!-- ============================================================ -->
<!-- TAB 1: NEWS -->
<!-- ============================================================ -->
<div class="tab-content active" id="tab-news">
  <div class="filters" id="newsFilters">
    <label>来源：<select id="newsSource">
      <option value="all">全部</option>
      <option value="xwlb">新闻联播</option>
      <option value="global">全球动态</option>
    </select></label>
    <label>行业：<select id="newsIndustry">
      <option value="all">全部行业</option>
    </select></label>
    <label>🔔 <input type="checkbox" id="newsSpecial"> 仅特别关注</label>
  </div>
  <div id="newsContainer">
    <div class="card" style="text-align:center;padding:40px;color:var(--dim)">加载新闻数据中...</div>
  </div>
</div>

<!-- ============================================================ -->
<!-- TAB 2: MODELS -->
<!-- ============================================================ -->
<div class="tab-content" id="tab-models">
  <div class="filters" id="modelFilters">
    <label>能力：<select id="mfCapability">
      <option value="all">全部能力</option>
    </select></label>
    <label>国内可用：<select id="mfDomestic">
      <option value="all">全部</option>
      <option value="直连">直连</option>
      <option value="需代理">需代理</option>
    </select></label>
    <label>厂商：<select id="mfVendor">
      <option value="all">全部厂商</option>
    </select></label>
    <label>排序：<select id="mfSort">
      <option value="price">价格↓</option>
      <option value="price_asc">价格↑</option>
      <option value="name">名称</option>
    </select></label>
  </div>
  <div class="stats-bar" id="modelStats"></div>
  <div class="grid" id="modelGrid"></div>
</div>

<!-- ============================================================ -->
<!-- TAB 3: ROBOTS -->
<!-- ============================================================ -->
<div class="tab-content" id="tab-robots">
  <div class="filters" id="robotFilters">
    <label>一级分类：<select id="rfType1">
      <option value="all">全部分类</option>
    </select></label>
    <label>二级分类：<select id="rfType2">
      <option value="all">全部</option>
    </select></label>
    <label>厂商：<select id="rfVendor">
      <option value="all">全部厂商</option>
    </select></label>
    <label>状态：<select id="rfStatus">
      <option value="all">全部状态</option>
      <option value="已量产">已量产</option>
      <option value="预售">预售中</option>
      <option value="原型">原型</option>
    </select></label>
  </div>
  <div class="stats-bar" id="robotStats"></div>
  <div style="overflow-x:auto">
    <table class="robot-table" id="robotTable">
      <thead>
        <tr>
          <th>厂商</th><th>型号</th><th>类型</th><th>尺寸</th><th>重量</th>
          <th>负载</th><th>续航</th><th>价格</th><th>状态</th>
        </tr>
      </thead>
      <tbody id="robotBody"></tbody>
    </table>
  </div>
</div>

<!-- ============================================================ -->
<!-- TAB 4: SKILLS -->
<!-- ============================================================ -->
<div class="tab-content" id="tab-skills">
  <div class="filters">
    <label>场景：<select id="sfScene">
      <option value="all">全部场景</option>
      <option value="work">工作</option>
      <option value="life">生活</option>
      <option value="research">研究</option>
    </select></label>
  </div>
  <div id="skillsContainer"></div>
</div>

</div><!-- /main -->

<script>
// ── DATA ───────────────────────────────────────────────────────────
let state = { models: [], robots: [], news: [], skills: [] };

async function loadJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function init() {
  const [models, robots, news, skills] = await Promise.all([
    loadJSON('./models/manual_models.json'),
    loadJSON('./robots/manual_robots.json'),
    loadJSON('./xwlb.json'),
    loadJSON('./skills.json'),
  ]);

  state.models = models || [];
  state.robots = robots || [];
  state.news = news || { days: [] };
  state.skills = skills || [];

  document.getElementById('updateStatus').textContent =
    `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;

  renderModels();
  renderRobots();
  renderNews();
  renderSkills();
}

// ── TAB SWITCHING ──────────────────────────────────────────────────
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── FILTER HELPERS ─────────────────────────────────────────────────
function populateSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

// ══════════════════════════════════════════════════════════════════
// MODELS
// ══════════════════════════════════════════════════════════════════
function renderModels() {
  const models = state.models;
  if (!models.length) return;

  // Populate filters
  const caps = [...new Set(models.map(m => m.capability_type).filter(Boolean))];
  const vendors = [...new Set(models.map(m => m.vendor).filter(Boolean))];
  populateSelect('mfCapability', caps);
  populateSelect('mfVendor', vendors);

  function filterModels() {
    const cap = document.getElementById('mfCapability').value;
    const dom = document.getElementById('mfDomestic').value;
    const ven = document.getElementById('mfVendor').value;
    const sort = document.getElementById('mfSort').value;

    let list = models.filter(m => {
      if (cap !== 'all' && m.capability_type !== cap) return false;
      if (dom !== 'all' && m.domestic_availability !== dom) return false;
      if (ven !== 'all' && m.vendor !== ven) return false;
      return true;
    });

    // Sort
    list.sort((a,b) => {
      if (sort === 'name') return a.model_name.localeCompare(b.model_name);
      // Price sort: extract numeric value
      const getPrice = (s) => parseFloat((s||'').replace(/[^0-9.]/g,'')) || 99999;
      return sort === 'price_asc' ? getPrice(a.output_price) - getPrice(b.output_price)
                                    : getPrice(b.output_price) - getPrice(a.output_price);
    });

    document.getElementById('modelStats').innerHTML =
      `<span>共 <b>${list.length}</b> 个模型</span>`;

    const grid = document.getElementById('modelGrid');
    grid.innerHTML = list.map(m => `
      <div class="entity-card">
        <div class="name"><a href="${m.official_url||'#'}" target="_blank">${m.model_name}</a></div>
        <div class="vendor">${m.vendor||''}</div>
        <div class="tags">
          ${m.capability_type ? `<span class="tag">${m.capability_type}</span>` : ''}
          ${m.domestic_availability === '直连' ? `<span class="tag cn">${m.domestic_availability}</span>`
            : m.domestic_availability ? `<span class="tag">${m.domestic_availability}</span>` : ''}
        </div>
        <div class="meta">
          ${m.output_price ? `<span>💰 ${m.output_price}</span>` : ''}
          ${m.context_window ? `<span>📏 ${m.context_window}</span>` : ''}
        </div>
        ${m.promotions ? `<div style="font-size:11px;color:var(--orange);margin-top:4px">🏷 ${m.promotions}</div>` : ''}
        <div class="links">
          ${m.official_url ? `<a href="${m.official_url}" target="_blank">官网</a>` : ''}
          ${m.tech_report_url ? `<a href="${m.tech_report_url}" target="_blank">技术报告</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  ['mfCapability','mfDomestic','mfVendor','mfSort'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterModels);
  });
  filterModels();
}

// ══════════════════════════════════════════════════════════════════
// ROBOTS
// ══════════════════════════════════════════════════════════════════
function renderRobots() {
  const robots = state.robots;
  if (!robots.length) return;

  const type1s = [...new Set(robots.map(r => r['类型_一级']||'').filter(Boolean))];
  const type2s = [...new Set(robots.map(r => r['类型_二级']||'').filter(Boolean))];
  const vendors = [...new Set(robots.map(r => r['厂商']||'').filter(Boolean))];
  populateSelect('rfType1', type1s);
  populateSelect('rfType2', type2s);
  populateSelect('rfVendor', vendors);

  function filterRobots() {
    const t1 = document.getElementById('rfType1').value;
    const t2 = document.getElementById('rfType2').value;
    const ven = document.getElementById('rfVendor').value;
    const st = document.getElementById('rfStatus').value;

    let list = robots.filter(r => {
      if (t1 !== 'all' && (r['类型_一级']||'') !== t1) return false;
      if (t2 !== 'all' && (r['类型_二级']||'') !== t2) return false;
      if (ven !== 'all' && (r['厂商']||'') !== ven) return false;
      if (st !== 'all') {
        const status = (r['当前状态']||'').toLowerCase();
        if (st === '已量产' && !status.includes('量产')) return false;
        if (st === '预售' && !status.includes('预售')) return false;
        if (st === '原型' && !status.includes('原型')) return false;
      }
      return true;
    });

    document.getElementById('robotStats').innerHTML =
      `<span>共 <b>${list.length}</b> 个型号</span>`;

    // Group by type1
    const groups = {};
    list.forEach(r => {
      const g = r['类型_一级']||'其他';
      if (!groups[g]) groups[g] = [];
      groups[g].push(r);
    });

    const tbody = document.getElementById('robotBody');
    tbody.innerHTML = Object.entries(groups).map(([cat, items]) => `
      <tr class="cat-row"><td colspan="9">${cat} (${items.length})</td></tr>
      ${items.map(r => {
        const status = (r['当前状态']||'').toLowerCase();
        let sc = 'status-prototype';
        if (status.includes('量产')) sc = 'status-production';
        else if (status.includes('预售')) sc = 'status-preview';
        return `<tr>
          <td>${r['厂商']||''}</td>
          <td><a href="${r['官网链接']||'#'}" target="_blank" style="color:var(--text);text-decoration:none">${r['型号']||''}</a></td>
          <td>${r['类型_二级']||''}</td>
          <td>${r['身高/尺寸']||''}</td>
          <td>${r['重量']||''}</td>
          <td>${r['负载能力']||''}</td>
          <td>${r['续航时间']||''}</td>
          <td>${r['价格']||''}</td>
          <td><span class="status-tag ${sc}">${r['当前状态']||''}</span></td>
        </tr>`;
      }).join('')}
    `).join('');
  }

  ['rfType1','rfType2','rfVendor','rfStatus'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterRobots);
  });
  filterRobots();
}

// ══════════════════════════════════════════════════════════════════
// NEWS
// ══════════════════════════════════════════════════════════════════
function renderNews() {
  const data = state.news;
  if (!data.days || !data.days.length) {
    document.getElementById('newsContainer').innerHTML =
      '<div class="card" style="text-align:center;padding:40px;color:var(--dim)">暂无新闻数据</div>';
    return;
  }

  // Populate industry filter
  const inds = [...new Set(data.days.flatMap(d => (d.industries||[]).map(i => i.name)))];
  populateSelect('newsIndustry', inds);

  function filterNews() {
    const src = document.getElementById('newsSource').value;
    const ind = document.getElementById('newsIndustry').value;
    const spec = document.getElementById('newsSpecial').checked;

    let days = data.days;
    if (src !== 'all') {
      days = days.filter(d => d.source === src);
    }
    if (spec) {
      days = days.filter(d => d.special_count > 0);
    }

    const container = document.getElementById('newsContainer');
    container.innerHTML = days.map(day => {
      let industries = day.industries || [];
      if (ind !== 'all') {
        industries = industries.filter(i => i.name === ind);
      }
      if (!industries.length) return '';

      return `<div class="news-day">
        <div class="date">📺 ${day.date.replace(/(\d{4})(\d{2})(\d{2})/,'$1年$2月$3日')}
          <span style="font-weight:400;color:var(--dim);font-size:12px">${day.total_items}条 · ${day.industry_count}个行业 ${day.special_count>0?' 🔔'+day.special_count+'条特别关注':''}</span>
        </div>
        ${industries.map(ind2 => `
          <div class="news-industry">
            <div class="ind-title">📌 ${ind2.name} <span class="count">${ind2.count}条${ind2.special?' 🔔':''}</span></div>
            ${(ind2.items||[]).map(item => `
              <div class="news-item" onclick="this.classList.toggle('expanded')">
                <div class="title">${item.title||''}${item.special?'<span class="spec-tag">🔔特别关注</span>':''}</div>
                <div class="summary">${item.summary||''}</div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }

  ['newsSource','newsIndustry'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterNews);
  });
  document.getElementById('newsSpecial').addEventListener('change', filterNews);
  filterNews();
}

// ── START ──────────────────────────────────────────────────────────
init();

// ══════════════════════════════════════════════════════════════════
// SKILLS
// ══════════════════════════════════════════════════════════════════
function renderSkills() {
  const scene = document.getElementById('sfScene').value;
  let list = state.skills;
  if (scene !== 'all') list = list.filter(s => s.scene === scene);

  const container = document.getElementById('skillsContainer');
  container.innerHTML = list.map(s => `
    <div class="skill-card">
      <div class="name">${s.name}</div>
      <div class="tags" style="margin:2px 0">
        <span class="tag">${s.scene === 'work' ? '工作' : s.scene === 'life' ? '生活' : '研究'}</span>
      </div>
      <div class="desc">${s.desc}</div>
      <div class="reason">💡 <strong>推荐理由：</strong>${s.reason}</div>
    </div>
  `).join('');
}

document.getElementById('sfScene').addEventListener('change', renderSkills);
</script>
</body>
