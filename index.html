<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIHOT · 智能情报站</title>
<meta name="description" content="AIHOT智能情报站 - 每日AI行业新闻、大模型选型对比、机器人档案(人形/清洁/四足/配送/AI玩具)、实用技能推荐">
<style>
/* ══════════════════════════════════════════════════════════════
   DESIGN SYSTEM — Linear-app (Open Design)
   ══════════════════════════════════════════════════════════════ */

:root {
  /* ── Surface ── */
  --bg:           #08090a;
  --surface:      #191a1b;
  --surface-elev: #1f2022;

  /* ── Foreground ── */
  --fg:   #f7f8f8;
  --fg-2: #d0d6e0;
  --muted: #8a8f98;
  --meta:  #62666d;

  /* ── Border ── */
  --border:      rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.05);

  /* ── Accent (Linear indigo-violet) ── */
  --accent:        #5e6ad2;
  --accent-on:     #ffffff;
  --accent-hover:  #828fff;
  --accent-active: #4752c4;
  --accent-glow:   rgba(94, 106, 210, 0.12);

  /* ── Semantic ── */
  --success: #27a644;
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ── Typography ── */
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "PingFang SC", "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "PingFang SC", "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   24px;
  --text-2xl:  32px;

  --leading-body: 1.5;
  --tracking-display: -0.022em;

  /* ── Spacing ── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* ── Radius ── */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  /* ── Elevation ── */
  --elev-ring:  0 0 0 1px var(--border);
  --elev-raised:
    rgba(0, 0, 0, 0.4) 0px 2px 4px,
    0 0 0 1px rgba(255, 255, 255, 0.05);

  --focus-ring: 0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%), 0 4px 12px rgba(0, 0, 0, 0.1);

  /* ── Motion ── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ── Layout ── */
  --container-max:            1280px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* --- Reset --- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  font-feature-settings: "cv01", "ss03";
  color: var(--fg-2);
  background: var(--bg);
  min-height: 100vh;
}

::selection { background: var(--accent-glow); color: var(--accent-hover); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

/* --- Typography scale (OD: multiplicative 1.25) --- */
h1, h2, h3, h4 { font-weight: 590; letter-spacing: -0.01em; }
h1 { font-size: 28px; line-height: 1.2; }
h2 { font-size: 22px; line-height: 1.3; }
h3 { font-size: 18px; line-height: 1.4; }
a { color: var(--accent-hover); text-decoration: none; }
a:hover { text-decoration: underline; }

/* --- Layout --- */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,15,0.92); backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1280px; margin: 0 auto;
  padding: var(--space-4) var(--space-6);
  display: flex; align-items: center; gap: var(--space-6);
}

.header-brand {
  display: flex; flex-direction: column; gap: 1px;
  flex-shrink: 0;
}
.header-brand h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
.header-brand h1 span { color: var(--accent); }
.header-brand .sub { font-size: 12px; color: var(--meta); letter-spacing: 0.02em; }

.header-center { flex: 1; min-width: 0; }
.header-right { display: flex; align-items: center; gap: var(--space-4); }

/* --- Search --- */
.search-bar {
  position: relative; width: 100%; max-width: 400px;
}
.search-bar input {
  width: 100%; padding: 8px 12px 8px 34px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--fg); font-size: 13px;
  font-family: inherit; outline: none; transition: border-color .15s;
}
.search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.search-bar input::placeholder { color: var(--meta); }
.search-bar::before {
  content: '🔍'; position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%); font-size: 13px; opacity: 0.5;
  pointer-events: none;
}

/* --- Status dot --- */
.status-dot {
  font-size: 12px; color: var(--muted); white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
.status-dot::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); flex-shrink: 0;
}

/* --- Tab navigation --- */
.tab-bar {
  border-bottom: 1px solid var(--border);
  padding: 0 var(--space-6);
  display: flex; gap: 0;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  background: none; border: none; color: var(--muted);
  font-size: 13px; font-family: inherit; font-weight: 510;
  padding: 10px 18px; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap; letter-spacing: 0.02em;
  position: relative;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--accent-hover); border-bottom-color: var(--accent); }
.tab-btn .badge {
  font-size: 10px; font-weight: 510;
  background: var(--accent-glow); color: var(--accent-hover);
  border-radius: 20px; padding: 1px 7px; margin-left: 5px;
  letter-spacing: 0;
}

/* --- Main content --- */
.main {
  max-width: 1280px; margin: 0 auto;
  padding: var(--space-6);
}

/* Tab content transition */
.tab-content {
  display: none;
  animation: tab-enter .2s ease-out;
}
.tab-content.active { display: block; }

@keyframes tab-enter {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .tab-content { animation: none; }
}

/* --- Cards (OD: subtle border, no heavy shadow) --- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--space-4);
  margin-bottom: var(--space-4);
  transition: border-color .15s;
}
.card:hover { border-color: rgba(255,255,255,0.14); }
.card-header {
  font-size: 11px; font-weight: 590; color: var(--meta);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: var(--space-2);
}

/* --- Filters bar --- */
.filters {
  display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-4);
  padding: var(--space-2) var(--space-4);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md);
  align-items: center;
}
.filters select, .filters input[type="text"] {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--fg); padding: 5px 10px; border-radius: var(--radius-sm);
  font-size: 12px; font-family: inherit; outline: none;
  transition: border-color .15s;
}
.filters select { min-width: 100px; cursor: pointer; }
.filters select:focus, .filters input:focus { border-color: var(--accent); }
.filters label {
  font-size: 12px; color: var(--muted);
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}

/* --- Stats bar --- */
.stats-bar {
  display: flex; gap: var(--space-6); padding: var(--space-2) 0;
  font-size: 12px; color: var(--muted);
}
.stats-bar .num { color: var(--fg); font-weight: 590; }

/* ══════════════════════════════════════════════════════════════
   NEWS SECTION
   ══════════════════════════════════════════════════════════════ */

.news-day {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--space-6);
  margin-bottom: var(--space-4);
}
.news-day .date {
  font-size: 15px; font-weight: 590; color: var(--accent-hover);
  margin-bottom: var(--space-4); letter-spacing: -0.01em;
}
.news-day .date .meta {
  font-weight: 400; font-size: 12px; color: var(--muted); margin-left: var(--space-2);
  letter-spacing: 0;
}

.news-industry { margin-bottom: var(--space-4); }
.news-industry:last-child { margin-bottom: 0; }

.news-industry .ind-title {
  font-size: 11px; font-weight: 590; color: var(--meta);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: var(--space-1); display: flex; align-items: center; gap: 6px;
}
.news-industry .ind-title .count { font-weight: 400; color: var(--meta); letter-spacing: 0; }

.news-item {
  padding: 8px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .1s;
  border-radius: 4px; padding-left: var(--space-2); padding-right: var(--space-2);
  margin: 0 calc(-1 * var(--space-2));
}
.news-item:last-child { border-bottom: none; }
.news-item:hover { background: rgba(255,255,255,0.03); }
.news-item .title {
  font-size: 14px; line-height: 1.5; margin-bottom: 1px;
  display: flex; align-items: flex-start; gap: 6px;
}
.news-item .summary {
  font-size: 12px; color: var(--muted); line-height: 1.6;
  display: none; margin-top: 4px;
}
.news-item.expanded .summary { display: block; }

.spec-tag {
  font-size: 10px; font-weight: 510;
  background: rgba(245,158,11,0.12);
  color: var(--warn); padding: 1px 6px; border-radius: 3px;
  flex-shrink: 0; margin-top: 2px; letter-spacing: 0;
}

/* ══════════════════════════════════════════════════════════════
   MODEL GRID
   ══════════════════════════════════════════════════════════════ */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: var(--space-2);
  margin-bottom: var(--space-6);
}

.entity-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--space-4);
  transition: border-color .15s, transform .15s;
}
.entity-card:hover {
  border-color: rgba(255,255,255,0.14);
  transform: translateY(-1px);
}
.entity-card .name { font-size: 14px; font-weight: 590; margin-bottom: 3px; }
.entity-card .name a { color: var(--fg); }
.entity-card .name a:hover { color: var(--accent-hover); }
.entity-card .vendor { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.entity-card .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }

.tag {
  font-size: 10px; font-weight: 510; padding: 2px 7px; border-radius: 4px;
  background: var(--accent-glow); color: var(--accent-hover);
  border: 1px solid rgba(94,106,210,0.2);
  letter-spacing: 0.02em;
}
.tag.cn { background: rgba(34,197,94,0.12); color: var(--success); border-color: rgba(34,197,94,0.2); }
.tag.special { background: rgba(245,158,11,0.12); color: var(--warn); border-color: rgba(245,158,11,0.2); }

.entity-card .meta {
  font-size: 11px; color: var(--muted);
  display: flex; gap: var(--space-2); flex-wrap: wrap;
}
.entity-card .meta span { display: flex; align-items: center; gap: 3px; }
.entity-card .links { margin-top: var(--space-2); display: flex; gap: var(--space-2); }
.entity-card .links a {
  font-size: 11px; color: var(--accent-hover); padding: 2px 9px;
  border: 1px solid rgba(94,106,210,0.2); border-radius: var(--radius-sm);
  transition: background .1s; text-decoration: none;
}
.entity-card .links a:hover { background: var(--accent-glow); }

.status-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; letter-spacing: 0.02em; }
.status-production { background: rgba(34,197,94,0.12); color: var(--success); }
.status-preview { background: rgba(245,158,11,0.12); color: var(--warn); }
.status-prototype { background: rgba(239,68,68,0.12); color: var(--danger); }

/* ══════════════════════════════════════════════════════════════
   ROBOT TABLE
   ══════════════════════════════════════════════════════════════ */

.robot-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: 12px;
}
.robot-table th {
  background: var(--surface); color: var(--muted); font-weight: 510;
  text-align: left; padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50; cursor: pointer;
  white-space: nowrap; font-size: 11px; letter-spacing: 0.02em;
  transition: color .1s;
}
.robot-table th:hover { color: var(--fg); }
.robot-table td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 12px;
}
.robot-table tr:hover td { background: rgba(255,255,255,0.02); }
.robot-table .cat-row td {
  background: rgba(255,255,255,0.04);
  font-weight: 590; font-size: 11px;
  color: var(--accent-hover); padding: 6px 10px;
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* --- Brand cards --- */
.brand-cards {
  display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-4);
}
.brand-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 10px 14px; min-width: 130px;
  cursor: pointer; transition: border-color .15s, transform .15s;
  display: flex; flex-direction: column; gap: 2px;
}
.brand-card:hover {
  border-color: var(--accent); transform: translateY(-1px);
}
.brand-card .name { font-size: 13px; font-weight: 590; color: var(--fg); }
.brand-card .sub { font-size: 11px; color: var(--muted); }
.brand-card .count { font-size: 11px; color: var(--accent-hover); }
.brand-card .link {
  font-size: 11px; color: var(--accent-hover); margin-top: 2px;
  padding: 2px 8px; border: 1px solid rgba(94,106,210,0.2);
  border-radius: var(--radius-sm); display: inline-block; width: fit-content;
  transition: background .1s; text-decoration: none;
}
.brand-card .link:hover { background: var(--accent-glow); }

/* --- Robot category tabs --- */
.cat-tabs {
  display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: var(--space-4);
}
.cat-tabs button {
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  font-size: 12px; font-family: inherit; font-weight: 510;
  padding: 6px 13px; cursor: pointer; border-radius: var(--radius-sm);
  transition: all .15s; letter-spacing: 0.02em;
}
.cat-tabs button:hover { color: var(--fg); border-color: rgba(255,255,255,0.14); }
.cat-tabs button.active {
  color: #fff; background: var(--accent); border-color: var(--accent);
}

/* --- Column toggles --- */
.col-toggles {
  display: flex; gap: 4px; flex-wrap: wrap; padding: var(--space-2) var(--space-4);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); margin-bottom: var(--space-2);
}
.col-toggles label {
  font-size: 11px; color: var(--muted); display: flex; align-items: center;
  gap: 3px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  transition: background .1s;
}
.col-toggles label:hover { background: rgba(255,255,255,0.04); }
.col-toggles input { accent-color: var(--accent); }

/* --- Pagination --- */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: var(--space-2); padding: var(--space-4) 0; margin-top: var(--space-2);
}
.pagination button {
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 12px; font-family: inherit; font-weight: 510;
  transition: all .15s; letter-spacing: 0.02em;
}
.pagination button:hover:not(:disabled) { color: var(--fg); border-color: rgba(255,255,255,0.14); }
.pagination button:disabled { opacity: .3; cursor: default; }
.pagination .page-info { font-size: 12px; color: var(--muted); padding: 0 var(--space-2); }
.pagination .page-info b { color: var(--fg); font-weight: 590; }

/* --- Ecosystem Overlay (OD: 200-300ms enter) --- */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.65); z-index: 1000;
  backdrop-filter: blur(6px);
  animation: overlay-in .2s ease-out;
}
.overlay.show { display: block; }

@keyframes overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.overlay-content {
  background: var(--surface-elev); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 12px; padding: var(--space-6); margin: 40px auto;
  width: 92%; max-width: 680px; max-height: 80vh; overflow-y: auto;
  animation: panel-in .25s ease-out;
}

@keyframes panel-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .overlay, .overlay-content { animation: none; }
}

/* --- Skills --- */
.skill-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--space-4);
  margin-bottom: var(--space-2);
  transition: border-color .15s;
}
.skill-card:hover { border-color: rgba(255,255,255,0.14); }
.skill-card .name { font-size: 14px; font-weight: 590; color: var(--accent-hover); }
.skill-card .desc { font-size: 12px; color: var(--muted); margin: 4px 0; line-height: 1.5; }
.skill-card .reason { font-size: 12px; color: var(--fg); margin-top: 4px; line-height: 1.5; }

/* --- Loading skeleton --- */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, rgba(255,255,255,0.04) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.4s ease infinite;
  border-radius: 4px;
}
.skeleton-line { height: 14px; margin-bottom: 8px; width: 100%; }
.skeleton-line.short { width: 60%; }

@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; background: var(--surface); }
}

/* --- Empty state --- */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--meta);
}
.empty-state h3 { font-size: 16px; color: var(--muted); margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 900px) {
  .header-inner { flex-wrap: wrap; gap: var(--space-2); padding: var(--space-2) var(--space-4); }
  .header-right { width: 100%; }
  .search-bar { max-width: 100%; }
  .header-brand .sub { display: none; }
}

@media (max-width: 768px) {
  .header-inner { padding: var(--space-2) var(--space-4); }
  .header-brand h1 { font-size: 17px; }
  .tab-bar { padding: 0 var(--space-4); }
  .tab-btn { font-size: 12px; padding: 8px 12px; }
  .main { padding: var(--space-4); }
  .grid { grid-template-columns: 1fr; }
  .filters { flex-direction: column; align-items: stretch; }
  .filters select { width: 100%; min-width: auto; }
  .brand-cards { flex-direction: column; }
  .brand-card { min-width: auto; width: 100%; }
  .cat-tabs { gap: 4px; }
  .cat-tabs button { font-size: 11px; padding: 5px 10px; }
  .col-toggles { flex-direction: column; max-height: 180px; overflow-y: auto; }
  .robot-table { font-size: 10px; }
  .robot-table th, .robot-table td { padding: 4px 5px; white-space: nowrap; }
  .card { padding: var(--space-2); }
  .news-day { padding: var(--space-4); }
  .stats-bar { gap: var(--space-2); font-size: 11px; flex-wrap: wrap; }
  .pagination { flex-wrap: wrap; }
  .overlay-content { margin: 20px auto; padding: var(--space-4); width: 96%; }
}

@media (max-width: 480px) {
  .header-brand h1 { font-size: 15px; }
  .tab-btn { font-size: 11px; padding: 6px 10px; }
  .main { padding: var(--space-2); }
  .news-item .title { font-size: 13px; }
}

<script>
// ── DATA ───────────────────────────────────────────────────────────
let state = { models: [], robots: [], news: [], skills: [] };
let searchResults = null;

async function loadJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function init() {
  const [models, robots, news, skills] = await Promise.all([
    loadJSON('./models/manual_models.json'),
    loadJSON('./robots/manual_robots.json'),
    loadJSON('./xwlb.json'),
    loadJSON('./skills.json'),
  ]);

  state.models = models || [];
  state.robots = robots || [];
  state.news = news || { days: [] };
  state.skills = skills || [];

  document.getElementById('updateStatus').textContent =
    `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;

  document.getElementById('modelsBadge').textContent = state.models.length;
  document.getElementById('skillsBadge').textContent = state.skills.length;

  renderModels();
  renderNews();
  renderSkills();

  // Load initial robot category
  loadRobotCategory('humanoid').then(data => {
    state.robots = data;
    document.getElementById('robotsBadge').textContent = state.robots.length;
    renderRobots();
    document.getElementById('updateStatus').textContent =
      `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;
  });

  loadEcosystem();
}

// ── TAB SWITCHING (with animation reset) ───────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => {
      t.classList.remove('active');
      // Trigger reflow so animation plays every time
      void t.offsetWidth;
    });
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── GLOBAL SEARCH ──────────────────────────────────────────────────
const SEARCHABLE_FIELDS = ['标题','title','型号','厂商','名称','model_name','vendor','desc','reason'];

document.getElementById('globalSearch').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const container = document.getElementById('newsContainer');
  if (!q || q.length < 2) {
    searchResults = null;
    renderNews();
    return;
  }

  // Search all news items
  const data = state.news;
  if (!data.days) return;

  const results = [];
  data.days.forEach(day => {
    const matchingInds = (day.industries||[])
      .map(ind => {
        const matchingItems = (ind.items||[]).filter(item =>
          (item.title||'').toLowerCase().includes(q) ||
          (item.summary||'').toLowerCase().includes(q)
        );
        return matchingItems.length ? { ...ind, items: matchingItems } : null;
      })
      .filter(Boolean);
    if (matchingInds.length) {
      results.push({ ...day, industries: matchingInds, _total: matchingInds.reduce((a,i) => a+i.items.length, 0) });
    }
  });

  searchResults = { days: results };

  if (!results.length) {
    container.innerHTML = `<div class="empty-state">
      <h3>🔍 未找到"${q}"的相关新闻</h3>
      <p>试试其他关键词</p>
    </div>`;
    return;
  }

  renderNews();
  // Also highlight matches in other tabs by switching
});

// ── FILTER HELPERS ─────────────────────────────────────────────────
function populateSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

// ══════════════════════════════════════════════════════════════════
// MODELS
// ══════════════════════════════════════════════════════════════════
function renderModels() {
  const models = state.models;
  if (!models.length) return;

  const caps = [...new Set(models.map(m => m.capability_type).filter(Boolean))];
  const vendors = [...new Set(models.map(m => m.vendor).filter(Boolean))];
  populateSelect('mfCapability', caps);
  populateSelect('mfVendor', vendors);

  function filterModels() {
    const cap = document.getElementById('mfCapability').value;
    const dom = document.getElementById('mfDomestic').value;
    const ven = document.getElementById('mfVendor').value;
    const sort = document.getElementById('mfSort').value;

    let list = models.filter(m => {
      if (cap !== 'all' && m.capability_type !== cap) return false;
      if (dom !== 'all' && m.domestic_availability !== dom) return false;
      if (ven !== 'all' && m.vendor !== ven) return false;
      return true;
    });

    list.sort((a,b) => {
      if (sort === 'name') return a.model_name.localeCompare(b.model_name);
      const getPrice = (s) => parseFloat((s||'').replace(/[^0-9.]/g,'')) || 99999;
      return sort === 'price_asc' ? getPrice(a.output_price) - getPrice(b.output_price)
                                    : getPrice(b.output_price) - getPrice(a.output_price);
    });

    document.getElementById('modelStats').innerHTML =
      `<span>共 <b>${list.length}</b> 个模型</span>`;

    const grid = document.getElementById('modelGrid');
    grid.innerHTML = list.map(m => `
      <div class="entity-card">
        <div class="name"><a href="${m.official_url||'#'}" target="_blank">${m.model_name}</a></div>
        <div class="vendor">${m.vendor||''}</div>
        <div class="tags">
          ${m.capability_type ? `<span class="tag">${m.capability_type}</span>` : ''}
          ${m.domestic_availability === '直连' ? `<span class="tag cn">${m.domestic_availability}</span>`
            : m.domestic_availability ? `<span class="tag">${m.domestic_availability}</span>` : ''}
        </div>
        <div class="meta">
          ${m.output_price ? `<span>💰 ${m.output_price}</span>` : ''}
          ${m.context_window ? `<span>📏 ${m.context_window}</span>` : ''}
        </div>
        ${m.promotions ? `<div style="font-size:11px;color:var(--warn);margin-top:4px">🏷 ${m.promotions}</div>` : ''}
        <div class="links">
          ${m.official_url ? `<a href="${m.official_url}" target="_blank">官网</a>` : ''}
          ${m.tech_report_url ? `<a href="${m.tech_report_url}" target="_blank">技术报告</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  ['mfCapability','mfDomestic','mfVendor','mfSort'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterModels);
  });
  filterModels();
}

// ══════════════════════════════════════════════════════════════════
// ROBOTS
// ══════════════════════════════════════════════════════════════════

let ecosystemData = null;

async function loadEcosystem() {
  if (ecosystemData) return ecosystemData;
  try {
    const r = await fetch('./robots/brand_ecosystem.json');
    if (!r.ok) return null;
    const d = await r.json();
    ecosystemData = d;
    return d;
  } catch(e) { return null; }
}

function getBrandEcosystem(vendor) {
  if (!ecosystemData) return null;
  const v = vendor.replace(/[()（]/g,'(').replace(/[)）]/g,')').toLowerCase();
  return ecosystemData.brands.find(b => b.name.replace(/[()（]/g,'(').replace(/[)）]/g,')').toLowerCase() === v) || null;
}

function showEcosystemPanel(vendor) {
  const eco = getBrandEcosystem(vendor);
  const overlay = document.getElementById('ecosystemOverlay');
  const panel = document.getElementById('ecosystemPanel');
  if (!eco) {
    panel.innerHTML = `<div style="text-align:center;padding:30px;color:var(--meta)">暂无 ${vendor} 的生态数据</div>
      <div style="text-align:center;margin-top:12px"><button onclick="closeEcosystem()" style="background:var(--accent);border:none;color:#fff;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px">关闭</button></div>`;
    overlay.classList.add('show');
    return;
  }

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:18px;color:var(--fg);margin:0;letter-spacing:-0.01em">${eco.name}</h2>
    <span style="font-size:11px;color:var(--success);letter-spacing:0.02em">● ${eco.ecosystem.open_source_degree}</span>
    <button onclick="closeEcosystem()" style="background:none;border:none;color:var(--meta);font-size:20px;cursor:pointer;line-height:1">✕</button>
  </div>`;

  // Datasets
  if (eco.ecosystem.datasets && eco.ecosystem.datasets.length) {
    html += `<div class="card" style="margin-bottom:12px"><div class="card-header">训练数据集</div>`;
    eco.ecosystem.datasets.forEach(d => {
      html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="color:${d.open_source?'var(--success)':'var(--meta)'}">${d.open_source?'🔓':'🔒'}</span>
        <span style="font-weight:510">${d.name}</span>
        <span style="font-size:11px;color:var(--muted)">${d.type}</span>
        ${d.scale ? `<span style="font-size:11px;color:var(--accent-hover)">${d.scale}</span>` : ''}
        ${d.url ? `<a href="${d.url}" target="_blank" style="font-size:11px;color:var(--accent-hover)">详情</a>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Models
  if (eco.ecosystem.models && eco.ecosystem.models.length) {
    html += `<div class="card" style="margin-bottom:12px"><div class="card-header">基础模型</div>`;
    eco.ecosystem.models.forEach(m => {
      html += `<div style="padding:6px 0;border-bottom:1px solid var(--border)">
        <div><span style="font-weight:510">${m.name}</span> <span style="font-size:11px;color:var(--muted)">${m.type}</span> ${m.open_source?'<span style="font-size:10px;color:var(--success);letter-spacing:0.02em">开源</span>':'<span style="font-size:10px;color:var(--warn);letter-spacing:0.02em">闭源</span>'}</div>
        ${m.capabilities ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${m.capabilities}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Key events
  if (eco.ecosystem.key_events && eco.ecosystem.key_events.length) {
    html += `<div class="card" style="margin-bottom:12px"><div class="card-header">关键事件</div>`;
    const sorted = [...eco.ecosystem.key_events].sort((a,b) => b.date.localeCompare(a.date));
    sorted.forEach(e => {
      html += `<div style="display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:11px;color:var(--accent-hover);min-width:80px;flex-shrink:0">${e.date.replace('00','?')}</span>
        <span style="font-size:13px">${e.event}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Open source & ROS
  html += `<div style="display:flex;gap:16px;font-size:12px;color:var(--muted);padding:8px 0;letter-spacing:0.02em">
    <span>🔧 ROS集成: ${eco.ecosystem.ros}</span>
    <span>📋 开源程度: ${eco.ecosystem.open_source_degree}</span>
  </div>`;

  panel.innerHTML = html;
  overlay.classList.add('show');
}

function closeEcosystem() {
  document.getElementById('ecosystemOverlay').classList.remove('show');
}

let robotData = {};
let currentRobotCat = 'humanoid';
let robotSortKey = null;
let robotSortAsc = true;

async function loadRobotCategory(cat) {
  const cfg = ROBOT_CONFIG[cat];
  if (!cfg) return [];
  if (robotData[cat]) return robotData[cat];
  const resp = await fetch(`./robots/${cfg.file}`);
  if (!resp.ok) return [];
  const data = await resp.json();
  robotData[cat] = data;
  return data;
}

function renderRobots() {
  const robots = state.robots || [];
  const cfg = ROBOT_CONFIG[currentRobotCat];
  if (!cfg || !robots.length) {
    document.getElementById('robotBody').innerHTML =
      '<tr><td colspan="10" style="text-align:center;color:var(--meta);padding:40px">暂无数据</td></tr>';
    return;
  }

  const visibleCols = getVisibleCols();

  // Brand cards
  const brands = {};
  robots.forEach(r => {
    const vendor = r['厂商'] || '未知';
    if (!brands[vendor]) brands[vendor] = { count: 0, url: r['官网'] || '#' };
    brands[vendor].count++;
  });

  document.getElementById('brandCards').innerHTML =
    Object.entries(brands).map(([name, info]) => `
      <div class="brand-card" onclick="showEcosystemPanel('${name.replace(/'/g,"\\'")}')" style="cursor:pointer">
        <div class="name">${name}</div>
        <div class="count">${info.count}款型号</div>
        <span class="link">查看品牌档案 ▶</span>
      </div>
    `).join('');

  // Type 2 filter
  const type2s = [...new Set(robots.map(r => r['类型']||r['形态']||'').filter(Boolean))];
  const sel = document.getElementById('rfType2');
  const oldVal = sel.value;
  sel.innerHTML = '<option value="all">全部</option>' +
    type2s.map(t => `<option value="${t}">${t}</option>`).join('');
  sel.value = type2s.includes(oldVal) ? oldVal : 'all';

  // Column toggles
  document.getElementById('colToggles').innerHTML =
    cfg.allCols.map(c => `
      <label><input type="checkbox" class="col-toggle" data-key="${c.key}"
        ${visibleCols.includes(c.key)?'checked':''}> ${c.label}</label>
    `).join('');

  document.querySelectorAll('.col-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      saveVisibleCols();
      renderRobots();
    });
  });

  // Filter
  const type2 = document.getElementById('rfType2').value;
  const status = document.getElementById('rfStatus').value;

  let list = robots.filter(r => {
    if (type2 !== 'all') {
      const t = r['类型'] || r['形态'] || '';
      if (t !== type2) return false;
    }
    if (status !== 'all') {
      const s = (r['状态']||'').toLowerCase();
      if (status === '已量产' && !s.includes('量产') && !s.includes('在售')) return false;
      if (status === '预售' && !s.includes('预售')) return false;
      if (status === '原型' && !s.includes('原型') && !s.includes('测试')) return false;
    }
    return true;
  });

  // Sort
  if (robotSortKey) {
    list.sort((a, b) => {
      let va = a[robotSortKey] || '', vb = b[robotSortKey] || '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return robotSortAsc ? na - nb : nb - na;
      return robotSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  // Pagination
  const pageSize = 10;
  const totalPages = Math.ceil(list.length / pageSize) || 1;
  if (robotPage >= totalPages) robotPage = 0;
  const page = robotPage;
  const pageList = list.slice(page * pageSize, (page + 1) * pageSize);

  // Stats
  document.getElementById('robotStatsLeft').innerHTML =
    `<span>共 <b>${list.length}</b> 个型号（本类共${robots.length}个）</span>`;
  document.getElementById('robotPageInfo').innerHTML =
    `第 <b>${page + 1}</b> / <b>${totalPages}</b> 页（每页${pageSize}条）`;
  document.getElementById('robotPrev').disabled = page === 0;
  document.getElementById('robotNext').disabled = page >= totalPages - 1;

  // Table header
  const sortedCol = cfg.allCols.filter(c => visibleCols.includes(c.key));
  document.getElementById('robotThead').innerHTML = '<tr>' +
    sortedCol.map(c => {
      const isSorted = robotSortKey === c.key;
      const arrow = isSorted ? (robotSortAsc ? ' ↑' : ' ↓') : '';
      return `<th onclick="sortRobot('${c.key}')" style="cursor:pointer${c.sort?'':';cursor:default'}">${c.label}${arrow}${c.sort?' ▾':''}</th>`;
    }).join('') + '</tr>';

  // Table body
  document.getElementById('robotBody').innerHTML = pageList.map(r => {
    const vendorHtml = r['官网'] ? `<a href="${r['官网']}" target="_blank" style="color:var(--accent-hover);text-decoration:none">${r['厂商']||''}</a>` : (r['厂商']||'');
    const level = r['数据级别'] || '';
    const levelBadge = level.includes('官方') ? '<span style="font-size:9px;color:var(--success);margin-left:4px">✓</span>'
      : level.includes('新闻') ? '<span style="font-size:9px;color:var(--warn);margin-left:4px">📰</span>'
      : '<span style="font-size:9px;color:var(--meta);margin-left:4px">?</span>';
    return '<tr>' + sortedCol.map(c => {
      if (c.key === '厂商') return `<td><span onclick="showEcosystemPanel('${(r['厂商']||'').replace(/'/g,"\\'")}')" style="cursor:pointer;color:var(--accent-hover)">${r['厂商']||''}</span>${levelBadge}</td>`;
      if (c.key === '型号' && r['官网']) {
        return `<td><a href="${r['官网']}" target="_blank" style="color:var(--fg);text-decoration:none">${r['型号']||''}</a></td>`;
      }
      const val = r[c.key] || '';
      return `<td>${val}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function getVisibleCols() {
  const key = `robot_cols_${currentRobotCat}`;
  const saved = localStorage.getItem(key);
  if (saved) return JSON.parse(saved);
  return ROBOT_CONFIG[currentRobotCat].defaultCols;
}

function saveVisibleCols() {
  const checked = [...document.querySelectorAll('.col-toggle:checked')].map(cb => cb.dataset.key);
  localStorage.setItem(`robot_cols_${currentRobotCat}`, JSON.stringify(checked));
}

let robotPage = 0;
const ROBOT_PAGE_SIZE = 10;
function robotPagePrev() { if (robotPage > 0) { robotPage--; renderRobots(); } }
function robotPageNext() { robotPage++; renderRobots(); }

function sortRobot(key) {
  const col = ROBOT_CONFIG[currentRobotCat].allCols.find(c => c.key === key);
  if (!col || !col.sort) return;
  if (robotSortKey === key) robotSortAsc = !robotSortAsc;
  else { robotSortKey = key; robotSortAsc = true; }
  renderRobots();
}

// Robot category switching
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('robotCatTabs')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.cat) return;

    document.querySelectorAll('#robotCatTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentRobotCat = btn.dataset.cat;
    robotSortKey = null;
    robotSortAsc = true;
    robotPage = 0;

    state.robots = await loadRobotCategory(currentRobotCat);
    document.getElementById('robotsBadge').textContent = state.robots.length;
    document.getElementById('updateStatus').textContent =
      `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;
    renderRobots();
  });

  ['rfType2', 'rfStatus'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => renderRobots());
  });
});

// NEWS
// ══════════════════════════════════════════════════════════════════
function renderNews() {
  const data = searchResults || state.news;
  if (!data.days || !data.days.length) {
    document.getElementById('newsContainer').innerHTML =
      '<div class="empty-state"><h3>暂无新闻数据</h3><p>数据采集中...</p></div>';
    return;
  }

  // Only populate filter from original data
  if (!searchResults) {
    const inds = [...new Set(state.news.days.flatMap(d => (d.industries||[]).map(i => i.name)))];
    const sel = document.getElementById('newsIndustry');
    if (sel.options.length <= 1) {
      populateSelect('newsIndustry', inds);
    }
  }

  function filterNews() {
    const src = document.getElementById('newsSource').value;
    const ind = document.getElementById('newsIndustry').value;
    const spec = document.getElementById('newsSpecial').checked;

    let days = data.days;
    if (src !== 'all') {
      days = days.filter(d => d.source === src);
    }
    if (spec) {
      days = days.filter(d => d.special_count > 0);
    }

    const container = document.getElementById('newsContainer');
    container.innerHTML = days.map(day => {
      let industries = day.industries || [];
      if (ind !== 'all') {
        industries = industries.filter(i => i.name === ind);
      }
      if (!industries.length) return '';

      return `<div class="news-day">
        <div class="date">📺 ${day.date.replace(/(\d{4})(\d{2})(\d{2})/,'$1年$2月$3日')}
          <span class="meta">${day.total_items}条 · ${day.industry_count}个行业 ${day.special_count>0?' 🔔'+day.special_count+'条特别关注':''}</span>
        </div>
        ${industries.map(ind2 => `
          <div class="news-industry">
            <div class="ind-title">📌 ${ind2.name} <span class="count">${ind2.count}条${ind2.special?' 🔔':''}</span></div>
            ${(ind2.items||[]).map(item => `
              <div class="news-item" onclick="this.classList.toggle('expanded')">
                <div class="title">${item.title||''}${item.special?'<span class="spec-tag">🔔 特别关注</span>':''}</div>
                <div class="summary">${item.summary||''}</div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }

  // Only attach listeners once
  if (!window._newsListenersAttached) {
    ['newsSource','newsIndustry'].forEach(id => {
      document.getElementById(id).addEventListener('change', filterNews);
    });
    document.getElementById('newsSpecial').addEventListener('change', filterNews);
    window._newsListenersAttached = true;
  }
  filterNews();
}

function renderSkills() {
  const scene = document.getElementById('sfScene').value;
  let list = state.skills;
  if (scene !== 'all') list = list.filter(s => s.scene === scene);

  const container = document.getElementById('skillsContainer');
  container.innerHTML = list.map(s => `
    <div class="skill-card">
      <div class="name">${s.name}</div>
      <div class="tags" style="margin:2px 0">
        <span class="tag">${s.scene === 'work' ? '工作' : s.scene === 'life' ? '生活' : '研究'}</span>
      </div>
      <div class="desc">${s.desc}</div>
      <div class="reason">💡 <strong>推荐理由：</strong>${s.reason}</div>
    </div>
  `).join('');
}
