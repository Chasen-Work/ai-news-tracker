<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIHOT · 智能情报站</title>
<meta name="description" content="AIHOT智能情报站 - 每日AI行业新闻、大模型选型对比、机器人档案(人形/清洁/四足/配送/AI玩具)、实用技能推荐">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --card: #131820; --border: #1e2736;
    --text: #c8d0e0; --dim: #6b7a99; --accent: #3b82f6;
    --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .header {
    border-bottom: 1px solid var(--border); padding: 20px 32px 12px;
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,14,20,.92); backdrop-filter: blur(12px);
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .header .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .header .status { font-size: 11px; color: var(--green); margin-left: 12px; }

  .tabs {
    display: flex; gap: 0; padding: 0 32px;
    border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .tabs button {
    background: none; border: none; color: var(--dim);
    font-size: 13px; padding: 10px 16px; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .2s;
    white-space: nowrap; font-family: inherit;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .badge { font-size: 10px; background: var(--accent); color: #fff; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }

  .main { max-width: 1400px; margin: 0 auto; padding: 20px 32px; }
  .tab-content { display: none; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 14px; transition: border-color .2s;
  }
  .card:hover { border-color: var(--accent); }
  .card h3 { font-size: 13px; font-weight: 500; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }

  /* Filters */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    padding: 12px; background: var(--card); border-radius: 8px; border: 1px solid var(--border);
  }
  .filters select, .filters input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: inherit;
  }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
  .filters label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 4px; }
  .filter-group { display: flex; align-items: center; gap: 4px; }

  /* Model/Entity Grid */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .entity-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; transition: all .2s;
  }
  .entity-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .entity-card .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .entity-card .name a { color: var(--text); text-decoration: none; }
  .entity-card .name a:hover { color: var(--accent); }
  .entity-card .vendor { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .entity-card .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: rgba(59,130,246,.15); color: var(--accent);
    border: 1px solid rgba(59,130,246,.25);
  }
  .tag.cn { background: rgba(34,197,94,.15); color: var(--green); border-color: rgba(34,197,94,.25); }
  .tag.special { background: rgba(245,158,11,.15); color: var(--orange); border-color: rgba(245,158,11,.25); }
  .entity-card .meta { font-size: 11px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
  .entity-card .meta span { display: flex; align-items: center; gap: 3px; }
  .entity-card .links { margin-top: 8px; display: flex; gap: 8px; }
  .entity-card .links a {
    font-size: 11px; color: var(--accent); text-decoration: none;
    padding: 2px 8px; border: 1px solid rgba(59,130,246,.3); border-radius: 4px;
  }
  .entity-card .links a:hover { background: rgba(59,130,246,.1); }
  .entity-card .status-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .status-production { background: rgba(34,197,94,.15); color: var(--green); }
  .status-preview { background: rgba(245,158,11,.15); color: var(--orange); }
  .status-prototype { background: rgba(239,68,68,.15); color: var(--red); }

  /* News section */
  .news-day {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .news-day .date { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
  .news-industry { margin-bottom: 12px; }
  .news-industry .ind-title {
    font-size: 12px; font-weight: 500; color: var(--orange);
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .news-industry .ind-title .count { font-weight: 400; color: var(--dim); }
  .news-item {
    padding: 6px 0; border-bottom: 1px solid rgba(30,39,54,.5); cursor: pointer;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item .title { font-size: 13px; margin-bottom: 2px; }
  .news-item .summary { font-size: 11px; color: var(--dim); display: none; }
  .news-item.expanded .summary { display: block; margin-top: 4px; }
  .news-item .spec-tag { font-size: 10px; background: rgba(245,158,11,.15); color: var(--orange); padding: 1px 5px; border-radius: 3px; margin-left: 6px; }

  /* Robot table */
  .robot-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  .robot-table th {
    background: var(--card); color: var(--dim); font-weight: 500;
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50; cursor: pointer;
    white-space: nowrap;
  }
  .robot-table th:hover { color: var(--text); }
  .robot-table td { padding: 8px 10px; border-bottom: 1px solid rgba(30,39,54,.3); }
  .robot-table tr:hover td { background: rgba(59,130,246,.05); }
  .robot-table .cat-row td {
    background: rgba(30,39,54,.5); font-weight: 600; font-size: 11px;
    color: var(--accent); padding: 6px 10px; letter-spacing: .5px;
  }

  /* Skill recommendations */
  .skill-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .skill-card .name { font-size: 14px; font-weight: 600; color: var(--accent); }
  .skill-card .desc { font-size: 12px; color: var(--dim); margin: 4px 0; }
  .skill-card .reason { font-size: 11px; color: var(--text); margin-top: 4px; }

  /* Stats bar */
  .stats-bar {
    display: flex; gap: 24px; padding: 12px 0;
    font-size: 12px; color: var(--dim);
  }
  .stats-bar span { display: flex; align-items: center; gap: 4px; }
  .stats-bar .num { color: var(--text); font-weight: 600; }

  /* Robot brand cards */
  .brand-cards {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .brand-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; min-width: 140px;
    cursor: pointer; transition: all .2s;
    display: flex; flex-direction: column; gap: 2px;
  }
  .brand-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .brand-card .name { font-size: 14px; font-weight: 600; color: var(--text); }
  .brand-card .sub { font-size: 11px; color: var(--dim); }
  .brand-card .count { font-size: 11px; color: var(--accent); }
  .brand-card .link {
    font-size: 11px; color: var(--accent); text-decoration: none;
    margin-top: 4px; padding: 2px 8px; border: 1px solid rgba(59,130,246,.3);
    border-radius: 4px; display: inline-block; width: fit-content;
  }
  .brand-card .link:hover { background: rgba(59,130,246,.1); }

  /* Robot category tabs */
  .cat-tabs {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .cat-tabs button {
    background: var(--card); border: 1px solid var(--border); color: var(--dim);
    font-size: 13px; padding: 8px 14px; cursor: pointer; border-radius: 8px;
    transition: all .2s; font-family: inherit;
  }
  .cat-tabs button:hover { color: var(--text); border-color: var(--accent); }
  .cat-tabs button.active { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* Column toggle */
  .col-toggles {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 12px;
  }
  .col-toggles label {
    font-size: 11px; color: var(--dim); display: flex; align-items: center;
    gap: 3px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
    transition: background .15s;
  }
  .col-toggles label:hover { background: rgba(59,130,246,.08); }
  .col-toggles input { accent-color: var(--accent); }
  /* ── Pagination ── */
  .pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 16px 0; margin-top: 12px;
  }
  .pagination button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
    font-family: inherit; transition: all .15s;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: .35; cursor: default; }
  .pagination .page-info { font-size: 12px; color: var(--dim); padding: 0 8px; }
  .pagination .page-info b { color: var(--text); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .header { padding: 14px 16px 10px; }
    .header h1 { font-size: 18px; }
    .header .sub { font-size: 11px; }
    .tabs { padding: 0 12px; }
    .tabs button { font-size: 12px; padding: 8px 10px; }
    .main { padding: 12px 12px; }
    .grid { grid-template-columns: 1fr; }
    .filters { flex-direction: column; }
    .filters select, .filters input { width: 100%; }
    .brand-cards { flex-direction: column; }
    .brand-card { min-width: auto; width: 100%; }
    .cat-tabs { gap: 4px; }
    .cat-tabs button { font-size: 12px; padding: 6px 10px; }
    .col-toggles { flex-direction: column; max-height: 200px; overflow-y: auto; }
    .robot-table { font-size: 10px; }
    .robot-table th, .robot-table td { padding: 4px 5px; white-space: nowrap; }
    .card { padding: 12px; }
    .stats-bar { gap: 12px; font-size: 11px; flex-wrap: wrap; }
    .pagination { flex-wrap: wrap; }
    .pagination button { padding: 8px 16px; font-size: 13px; }
    .news-item .title { font-size: 12px; }
    .entity-card { padding: 10px; }
  }

  @media (max-width: 480px) {
    .header h1 { font-size: 16px; }
    .header .status { display: block; margin-left: 0; margin-top: 4px; }
    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabs button { font-size: 11px; padding: 6px 8px; }
    .main { padding: 8px 8px; }
    .card h3 { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>AI<span>HOT</span> · 智能情报站
    <span class="status" id="updateStatus">● 数据加载中...</span>
  </h1>
  <div class="sub">新闻联播 · 模型选型 · 机器人档案 · 技能推荐</div>
</div>

<div class="tabs" id="tabs">
  <button class="active" data-tab="news">📺 新闻</button>
  <button data-tab="models">🧠 模型选型</button>
  <button data-tab="robots">🤖 机器人档案</button>
  <button data-tab="skills">🛠 技能推荐</button>
</div>

<div class="main">

<!-- ============================================================ -->
<!-- TAB 1: NEWS -->
<!-- ============================================================ -->
<div class="tab-content active" id="tab-news">
  <div class="filters" id="newsFilters">
    <label>来源：<select id="newsSource">
      <option value="all">全部</option>
      <option value="xwlb">新闻联播</option>
      <option value="global">全球动态</option>
    </select></label>
    <label>行业：<select id="newsIndustry">
      <option value="all">全部行业</option>
    </select></label>
    <label>🔔 <input type="checkbox" id="newsSpecial"> 仅特别关注</label>
  </div>
  <div id="newsContainer">
    <div class="card" style="text-align:center;padding:40px;color:var(--dim)">加载新闻数据中...</div>
  </div>
</div>

<!-- ============================================================ -->
<!-- TAB 2: MODELS -->
<!-- ============================================================ -->
<div class="tab-content" id="tab-models">
  <div class="filters" id="modelFilters">
    <label>能力：<select id="mfCapability">
      <option value="all">全部能力</option>
    </select></label>
    <label>国内可用：<select id="mfDomestic">
      <option value="all">全部</option>
      <option value="直连">直连</option>
      <option value="需代理">需代理</option>
    </select></label>
    <label>厂商：<select id="mfVendor">
      <option value="all">全部厂商</option>
    </select></label>
    <label>排序：<select id="mfSort">
      <option value="price">价格↓</option>
      <option value="price_asc">价格↑</option>
      <option value="name">名称</option>
    </select></label>
  </div>
  <div class="stats-bar" id="modelStats"></div>
  <div class="grid" id="modelGrid"></div>
</div>

<!-- ============================================================ -->
<!-- TAB 3: ROBOTS -->
<!-- ============================================================ -->
<div class="tab-content" id="tab-robots">
  <!-- Category navigation -->
  <div class="cat-tabs" id="robotCatTabs">
    <button class="active" data-cat="humanoid">🤖 人形机器人</button>
    <button data-cat="commercial_cleaner">🧹 商用清洁</button>
    <button data-cat="industrial_quadruped">🐕 四足工业</button>
    <button data-cat="delivery_vehicle">🚚 无人配送车</button>
    <button data-cat="ai_toy">🧸 AI玩具</button>
  </div>

  <!-- Brand cards -->
  <div class="brand-cards" id="brandCards"></div>

  <!-- Filters -->
  <div class="filters" id="robotFilters">
    <label>二级分类：<select id="rfType2"><option value="all">全部</option></select></label>
    <label>状态：<select id="rfStatus">
      <option value="all">全部状态</option>
      <option value="已量产">已量产</option>
      <option value="预售">预售中</option>
      <option value="原型">原型</option>
    </select></label>
  </div>

  <!-- Column visibility toggles -->
  <div class="col-toggles" id="colToggles"></div>

  <!-- Stats + Table -->
  <div class="stats-bar" id="robotStats">
    <span id="robotStatsLeft">共 <b>0</b> 个型号</span>
  </div>
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table class="robot-table" id="robotTable">
      <thead id="robotThead"></thead>
      <tbody id="robotBody"></tbody>
    </table>
  </div>
  <div class="pagination" id="robotPagination">
    <button id="robotPrev" onclick="robotPagePrev()">‹ 上一页</button>
    <span class="page-info" id="robotPageInfo">第 <b>1</b> / <b>1</b> 页</span>
    <button id="robotNext" onclick="robotPageNext()">下一页 ›</button>
  </div>
</div>

<!-- ============================================================ -->
<!-- TAB 4: SKILLS -->
<!-- ============================================================ -->
<div class="tab-content" id="tab-skills">
  <div class="filters">
    <label>场景：<select id="sfScene">
      <option value="all">全部场景</option>
      <option value="work">工作</option>
      <option value="life">生活</option>
      <option value="research">研究</option>
    </select></label>
  </div>
  <div id="skillsContainer"></div>
</div>

</div><!-- /main -->

<script>
// ── DATA ───────────────────────────────────────────────────────────
let state = { models: [], robots: [], news: [], skills: [] };

async function loadJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function init() {
  const [models, robots, news, skills] = await Promise.all([
    loadJSON('./models/manual_models.json'),
    loadJSON('./robots/manual_robots.json'),
    loadJSON('./xwlb.json'),
    loadJSON('./skills.json'),
  ]);

  state.models = models || [];
  state.robots = robots || [];
  state.news = news || { days: [] };
  state.skills = skills || [];

  document.getElementById('updateStatus').textContent =
    `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;

  renderModels();
  renderNews();
  renderSkills();

  // Load initial robot category
  loadRobotCategory('humanoid').then(data => {
    state.robots = data;
    renderRobots();
    document.getElementById('updateStatus').textContent =
      `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;
  });
}

// ── TAB SWITCHING ──────────────────────────────────────────────────
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── FILTER HELPERS ─────────────────────────────────────────────────
function populateSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

// ══════════════════════════════════════════════════════════════════
// MODELS
// ══════════════════════════════════════════════════════════════════
function renderModels() {
  const models = state.models;
  if (!models.length) return;

  // Populate filters
  const caps = [...new Set(models.map(m => m.capability_type).filter(Boolean))];
  const vendors = [...new Set(models.map(m => m.vendor).filter(Boolean))];
  populateSelect('mfCapability', caps);
  populateSelect('mfVendor', vendors);

  function filterModels() {
    const cap = document.getElementById('mfCapability').value;
    const dom = document.getElementById('mfDomestic').value;
    const ven = document.getElementById('mfVendor').value;
    const sort = document.getElementById('mfSort').value;

    let list = models.filter(m => {
      if (cap !== 'all' && m.capability_type !== cap) return false;
      if (dom !== 'all' && m.domestic_availability !== dom) return false;
      if (ven !== 'all' && m.vendor !== ven) return false;
      return true;
    });

    // Sort
    list.sort((a,b) => {
      if (sort === 'name') return a.model_name.localeCompare(b.model_name);
      // Price sort: extract numeric value
      const getPrice = (s) => parseFloat((s||'').replace(/[^0-9.]/g,'')) || 99999;
      return sort === 'price_asc' ? getPrice(a.output_price) - getPrice(b.output_price)
                                    : getPrice(b.output_price) - getPrice(a.output_price);
    });

    document.getElementById('modelStats').innerHTML =
      `<span>共 <b>${list.length}</b> 个模型</span>`;

    const grid = document.getElementById('modelGrid');
    grid.innerHTML = list.map(m => `
      <div class="entity-card">
        <div class="name"><a href="${m.official_url||'#'}" target="_blank">${m.model_name}</a></div>
        <div class="vendor">${m.vendor||''}</div>
        <div class="tags">
          ${m.capability_type ? `<span class="tag">${m.capability_type}</span>` : ''}
          ${m.domestic_availability === '直连' ? `<span class="tag cn">${m.domestic_availability}</span>`
            : m.domestic_availability ? `<span class="tag">${m.domestic_availability}</span>` : ''}
        </div>
        <div class="meta">
          ${m.output_price ? `<span>💰 ${m.output_price}</span>` : ''}
          ${m.context_window ? `<span>📏 ${m.context_window}</span>` : ''}
        </div>
        ${m.promotions ? `<div style="font-size:11px;color:var(--orange);margin-top:4px">🏷 ${m.promotions}</div>` : ''}
        <div class="links">
          ${m.official_url ? `<a href="${m.official_url}" target="_blank">官网</a>` : ''}
          ${m.tech_report_url ? `<a href="${m.tech_report_url}" target="_blank">技术报告</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  ['mfCapability','mfDomestic','mfVendor','mfSort'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterModels);
  });
  filterModels();
}

// ══════════════════════════════════════════════════════════════════
// ROBOTS - Dynamic per-category display
// ══════════════════════════════════════════════════════════════════

const ROBOT_CONFIG = {
  humanoid: {
    label: '🤖 人形机器人', file: 'humanoid.json',

let robotData = {};
let currentRobotCat = 'humanoid';
let robotSortKey = null;
let robotSortAsc = true;

async function loadRobotCategory(cat) {
  const cfg = ROBOT_CONFIG[cat];
  if (!cfg) return [];
  if (robotData[cat]) return robotData[cat];
  const resp = await fetch(`./robots/${cfg.file}`);
  if (!resp.ok) return [];
  const data = await resp.json();
  robotData[cat] = data;
  return data;
}

function renderRobots() {
  const robots = state.robots || [];
  const cfg = ROBOT_CONFIG[currentRobotCat];
  if (!cfg || !robots.length) {
    document.getElementById('robotBody').innerHTML =
      '<tr><td colspan="10" style="text-align:center;color:var(--dim);padding:40px">暂无数据</td></tr>';
    return;
  }

  const visibleCols = getVisibleCols();
  
  // ── Brand cards ──
  const brands = {};
  robots.forEach(r => {
    const vendor = r['厂商'] || '未知';
    if (!brands[vendor]) brands[vendor] = { count: 0, url: r['官网'] || '#' };
    brands[vendor].count++;
  });
  
  document.getElementById('brandCards').innerHTML =
    Object.entries(brands).map(([name, info]) => `
      <div class="brand-card" onclick="window.open('${info.url}','_blank')">
        <div class="name">${name}</div>
        <div class="count">${info.count}款型号</div>
        <span class="link">查看官网 ▶</span>
      </div>
    `).join('');

  // ── Type 2 filter ──
  const type2s = [...new Set(robots.map(r => r['类型']||r['形态']||'').filter(Boolean))];
  const sel = document.getElementById('rfType2');
  const oldVal = sel.value;
  sel.innerHTML = '<option value="all">全部</option>' +
    type2s.map(t => `<option value="${t}">${t}</option>`).join('');
  sel.value = type2s.includes(oldVal) ? oldVal : 'all';

  // ── Column toggles ──
  document.getElementById('colToggles').innerHTML =
    cfg.allCols.map(c => `
      <label><input type="checkbox" class="col-toggle" data-key="${c.key}"
        ${visibleCols.includes(c.key)?'checked':''}> ${c.label}</label>
    `).join('');
  
  document.querySelectorAll('.col-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      saveVisibleCols();
      renderRobots();
    });
  });

  // ── Filter ──
  const type2 = document.getElementById('rfType2').value;
  const status = document.getElementById('rfStatus').value;

  let list = robots.filter(r => {
    if (type2 !== 'all') {
      const t = r['类型'] || r['形态'] || '';
      if (t !== type2) return false;
    }
    if (status !== 'all') {
      const s = (r['状态']||'').toLowerCase();
      if (status === '已量产' && !s.includes('量产') && !s.includes('在售')) return false;
      if (status === '预售' && !s.includes('预售')) return false;
      if (status === '原型' && !s.includes('原型') && !s.includes('测试')) return false;
    }
    return true;
  });

  // ── Sort ──
  if (robotSortKey) {
    list.sort((a, b) => {
      let va = a[robotSortKey] || '', vb = b[robotSortKey] || '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return robotSortAsc ? na - nb : nb - na;
      return robotSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  // ── Pagination ──
  const pageSize = 10;
  const totalPages = Math.ceil(list.length / pageSize) || 1;
  if (robotPage >= totalPages) robotPage = 0;
  const page = robotPage;
  const pageList = list.slice(page * pageSize, (page + 1) * pageSize);

  // ── Stats ──
  document.getElementById('robotStatsLeft').innerHTML =
    `<span>共 <b>${list.length}</b> 个型号（本类共${robots.length}个）</span>`;
  document.getElementById('robotPageInfo').innerHTML =
    `第 <b>${page + 1}</b> / <b>${totalPages}</b> 页（每页${pageSize}条）`;
  document.getElementById('robotPrev').disabled = page === 0;
  document.getElementById('robotNext').disabled = page >= totalPages - 1;

  // ── Table header ──
  const sortedCol = cfg.allCols.filter(c => visibleCols.includes(c.key));
  document.getElementById('robotThead').innerHTML = '<tr>' +
    sortedCol.map(c => {
      const isSorted = robotSortKey === c.key;
      const arrow = isSorted ? (robotSortAsc ? ' ↑' : ' ↓') : '';
      return `<th onclick="sortRobot('${c.key}')" style="cursor:pointer${c.sort?'':';cursor:default'}">${c.label}${arrow}${c.sort?' ▾':''}</th>`;
    }).join('') + '</tr>';

  // ── Table body ──
  document.getElementById('robotBody').innerHTML = pageList.map(r => {
    // Build vendor URL link
    const vendorHtml = r['官网'] ? `<a href="${r['官网']}" target="_blank" style="color:var(--accent);text-decoration:none">${r['厂商']||''}</a>` : (r['厂商']||'');
    return '<tr>' + sortedCol.map(c => {
      if (c.key === '厂商') return `<td>${vendorHtml}</td>`;
      if (c.key === '型号' && r['官网']) {
        return `<td><a href="${r['官网']}" target="_blank" style="color:var(--text);text-decoration:none">${r['型号']||''}</a></td>`;
      }
      const val = r[c.key] || '';
      return `<td>${val}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function getVisibleCols() {
  const key = `robot_cols_${currentRobotCat}`;
  const saved = localStorage.getItem(key);
  if (saved) return JSON.parse(saved);
  return ROBOT_CONFIG[currentRobotCat].defaultCols;
}

function saveVisibleCols() {
  const checked = [...document.querySelectorAll('.col-toggle:checked')].map(cb => cb.dataset.key);
  localStorage.setItem(`robot_cols_${currentRobotCat}`, JSON.stringify(checked));
}

// ── Pagination functions ──
let robotPage = 0;
const ROBOT_PAGE_SIZE = 10;
function robotPagePrev() { if (robotPage > 0) { robotPage--; renderRobots(); } }
function robotPageNext() { robotPage++; renderRobots(); }

function sortRobot(key) {
  const col = ROBOT_CONFIG[currentRobotCat].allCols.find(c => c.key === key);
  if (!col || !col.sort) return;
  if (robotSortKey === key) robotSortAsc = !robotSortAsc;
  else { robotSortKey = key; robotSortAsc = true; }
  renderRobots();
}

// Robot category switching
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('robotCatTabs')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.cat) return;
    
    document.querySelectorAll('#robotCatTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    currentRobotCat = btn.dataset.cat;
    robotSortKey = null;
    robotSortAsc = true;
    robotPage = 0;
    
    // Load and render
    state.robots = await loadRobotCategory(currentRobotCat);
    document.getElementById('updateStatus').textContent =
      `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;
    renderRobots();
  });

  // Re-filter on filter change
  ['rfType2', 'rfStatus'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => renderRobots());
  });
});

// NEWS
// ══════════════════════════════════════════════════════════════════
function renderNews() {
  const data = state.news;
  if (!data.days || !data.days.length) {
    document.getElementById('newsContainer').innerHTML =
      '<div class="card" style="text-align:center;padding:40px;color:var(--dim)">暂无新闻数据</div>';
    return;
  }

  // Populate industry filter
  const inds = [...new Set(data.days.flatMap(d => (d.industries||[]).map(i => i.name)))];
  populateSelect('newsIndustry', inds);

  function filterNews() {
    const src = document.getElementById('newsSource').value;
    const ind = document.getElementById('newsIndustry').value;
    const spec = document.getElementById('newsSpecial').checked;

    let days = data.days;
    if (src !== 'all') {
      days = days.filter(d => d.source === src);
    }
    if (spec) {
      days = days.filter(d => d.special_count > 0);
    }

    const container = document.getElementById('newsContainer');
    container.innerHTML = days.map(day => {
      let industries = day.industries || [];
      if (ind !== 'all') {
        industries = industries.filter(i => i.name === ind);
      }
      if (!industries.length) return '';

      return `<div class="news-day">
        <div class="date">📺 ${day.date.replace(/(\d{4})(\d{2})(\d{2})/,'$1年$2月$3日')}
          <span style="font-weight:400;color:var(--dim);font-size:12px">${day.total_items}条 · ${day.industry_count}个行业 ${day.special_count>0?' 🔔'+day.special_count+'条特别关注':''}</span>
        </div>
        ${industries.map(ind2 => `
          <div class="news-industry">
            <div class="ind-title">📌 ${ind2.name} <span class="count">${ind2.count}条${ind2.special?' 🔔':''}</span></div>
            ${(ind2.items||[]).map(item => `
              <div class="news-item" onclick="this.classList.toggle('expanded')">
                <div class="title">${item.title||''}${item.special?'<span class="spec-tag">🔔特别关注</span>':''}</div>
                <div class="summary">${item.summary||''}</div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }

  ['newsSource','newsIndustry'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterNews);
  });
  document.getElementById('newsSpecial').addEventListener('change', filterNews);
  filterNews();
}

  const container = document.getElementById('skillsContainer');

    <div class="skill-card">
      <div class="name">${s.name}</div>
      <div class="tags" style="margin:2px 0">
        <span class="tag">${s.scene === 'work' ? '工作' : s.scene === 'life' ? '生活' : '研究'}</span>
      </div>
      <div class="desc">${s.desc}</div>
      <div class="reason">💡 <strong>推荐理由：</strong>${s.reason}</div>
    </div>
  `).join('');
}
