<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIHOT · 机器人情报站</title>
<meta name="description" content="AIHOT机器人情报站 - 机器人数据库对比、大模型选型、行业新闻、实用技能推荐">
<style>
/* ══════════════════════════════════════════════════════════════
   DESIGN SYSTEM — Vercel (Open Design)
   Geist font stack with system fallbacks
   ══════════════════════════════════════════════════════════════ */

:root {
  /* ── Surface ── */
  --bg:           #ffffff;
  --surface:      #ffffff;
  --surface-warm: #ffffff;

  /* ── Foreground ── */
  --fg:   #171717;
  --fg-2: #4d4d4d;
  --muted: #666666;
  --meta:  #808080;

  /* ── Border (shadow-as-border alpha) ── */
  --border:      rgba(0, 0, 0, 0.08);
  --border-soft: rgba(0, 0, 0, 0.04);

  /* ── Accent (Vercel Blue) ── */
  --accent:        #0070f3;
  --accent-on:     #ffffff;
  --accent-hover:  #0060d6;
  --accent-active: #0050b8;
  --accent-glow:   rgba(0, 112, 243, 0.10);

  /* ── Semantic ── */
  --success: #16a34a;
  --warn:    #d97706;
  --danger:  #dc2626;

  /* ── Typography: Geist ── */
  --font-display: "Geist", "Geist Sans", -apple-system, "Segoe UI", Arial, sans-serif;
  --font-body:    "Geist", "Geist Sans", -apple-system, "Segoe UI", Arial, sans-serif;
  --font-mono:    "Geist Mono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Monaco, "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;

  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   20px;
  --text-xl:   24px;
  --text-2xl:  32px;
  --text-3xl:  40px;
  --text-4xl:  48px;

  --leading-body:  1.5;
  --leading-tight: 1.1;
  --tracking-display: -0.05em;

  /* ── Spacing ── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* ── Radius ── */
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ── Elevation ── */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised:
    0 0 0 1px rgba(0, 0, 0, 0.08),
    0 2px 2px rgba(0, 0, 0, 0.04),
    0 8px 8px -8px rgba(0, 0, 0, 0.04),
    0 0 0 1px #fafafa;

  --focus-ring: 0 0 0 2px var(--accent);

  /* ── Motion ── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ── Layout ── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* --- Reset --- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  color: var(--fg-2);
  background: var(--bg);
  min-height: 100vh;
}

::selection { background: var(--accent-glow); color: var(--accent-hover); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.18); }

/* --- Typography (Vercel: 3-weight system) --- */
h1, h2, h3, h4 { font-weight: 600; color: var(--fg); }
h1 { font-size: var(--text-2xl); letter-spacing: -0.04em; line-height: var(--leading-tight); }
h2 { font-size: var(--text-xl); letter-spacing: -0.04em; line-height: 1.25; }
h3 { font-size: var(--text-lg); letter-spacing: -0.03em; line-height: 1.25; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── App Header (Vercel: sticky, shadow-border) ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: var(--elev-ring);
}

.header-inner {
  max-width: var(--container-max); margin: 0 auto;
  padding: var(--space-4) var(--space-6);
  display: flex; align-items: center; gap: var(--space-6);
}

.header-brand {
  display: flex; flex-direction: column; gap: 1px;
  flex-shrink: 0;
}
.header-brand h1 {
  font-size: var(--text-xl); font-weight: 600;
  letter-spacing: -0.04em;
}
.header-brand h1 span { color: var(--accent); }
.header-brand .sub {
  font-size: var(--text-xs); color: var(--meta);
  letter-spacing: normal;
}

.header-center { flex: 1; min-width: 0; }
.header-right { display: flex; align-items: center; gap: var(--space-4); }

/* ── Search (Vercel: shadow-border input) ── */
.search-bar {
  position: relative; width: 100%; max-width: 400px;
}
.search-bar input {
  width: 100%; padding: var(--space-2) var(--space-3) var(--space-2) 36px;
  background: var(--bg); border: none;
  box-shadow: var(--elev-ring);
  border-radius: var(--radius-sm); color: var(--fg);
  font-size: var(--text-sm); font-family: inherit;
  outline: none; transition: box-shadow var(--motion-fast);
}
.search-bar input:focus {
  box-shadow: var(--focus-ring), var(--elev-ring);
}
.search-bar input::placeholder { color: var(--meta); }
.search-bar::before {
  content: '🔍'; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); font-size: var(--text-sm);
  opacity: 0.4; pointer-events: none;
}

/* ── Status indicator ── */
.status-dot {
  font-size: var(--text-xs); color: var(--muted);
  white-space: nowrap; display: flex; align-items: center; gap: var(--space-1);
}
.status-dot::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); flex-shrink: 0;
}

/* ── Tab Navigation (Vercel: shadow-border bottom) ── */
.tab-bar {
  box-shadow: 0 1px 0 0 var(--border);
  padding: 0 var(--space-6);
  display: flex; justify-content: center; gap: 0;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  background: none; border: none; color: var(--muted);
  font-size: var(--text-sm); font-family: inherit; font-weight: 500;
  padding: 10px 18px; cursor: pointer;
  box-shadow: 0 0 0 0 var(--accent);
  transition: color var(--motion-fast), box-shadow var(--motion-fast);
  white-space: nowrap; position: relative;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--fg); font-weight: 600; }
.tab-btn.active::after {
  content: ''; position: absolute; bottom: 0; left: 18px; right: 18px;
  height: 2px; background: var(--fg); border-radius: 1px;
}
.tab-btn .badge {
  font-size: 10px; font-weight: 500;
  background: var(--accent-glow); color: var(--accent);
  border-radius: var(--radius-pill); padding: 1px 7px; margin-left: 5px;
}

/* ── Main Content ── */
.main {
  max-width: var(--container-max); margin: 0 auto;
  padding: var(--space-6);
}

/* Tab content transition */
.tab-content { display: none; animation: tab-enter .2s var(--ease-standard); }
.tab-content.active { display: block; }

@keyframes tab-enter {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .tab-content { animation: none; } }

/* ── Vercel Card (shadow-as-border, multi-layer) ── */
.vc-card {
  background: var(--surface); border: none;
  box-shadow: var(--elev-raised);
  border-radius: var(--radius-md); padding: var(--space-4);
  margin-bottom: var(--space-4);
  transition: box-shadow var(--motion-base) var(--ease-standard);
}
.vc-card:hover {
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.12),
    0 2px 4px rgba(0, 0, 0, 0.06),
    0 12px 12px -8px rgba(0, 0, 0, 0.06),
    0 0 0 1px #fafafa;
}
.vc-card-header {
  font-size: var(--text-xs); font-weight: 500; color: var(--meta);
  letter-spacing: 0.02em;
  margin-bottom: var(--space-3);
}

/* ── Filters Bar ── */
.filters {
  display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--surface); border: none;
  box-shadow: var(--elev-ring);
  border-radius: var(--radius-md);
  align-items: center;
}
.filters select, .filters input[type="text"] {
  background: var(--bg); border: none;
  box-shadow: var(--elev-ring);
  color: var(--fg); padding: 5px 10px; border-radius: var(--radius-sm);
  font-size: var(--text-xs); font-family: inherit; outline: none;
  transition: box-shadow var(--motion-fast);
}
.filters select { min-width: 100px; cursor: pointer; }
.filters select:focus, .filters input:focus { box-shadow: var(--focus-ring), var(--elev-ring); }
.filters label {
  font-size: var(--text-xs); color: var(--muted);
  display: flex; align-items: center; gap: var(--space-1);
  white-space: nowrap;
}

/* ── Stats Bar ── */
.stats-bar {
  display: flex; gap: var(--space-6); padding: var(--space-2) 0;
  font-size: var(--text-xs); color: var(--muted);
}
.stats-bar .num { color: var(--fg); font-weight: 500; }

/* ══════════════════════════════════════════════════════════════
   NEWS SECTION (Vercel: elevated cards, mono labels)
   ══════════════════════════════════════════════════════════════ */
.news-day {
  background: var(--surface); border: none;
  box-shadow: var(--elev-ring);
  border-radius: var(--radius-md); padding: var(--space-6);
  margin-bottom: var(--space-4);
}
.news-day .date {
  font-size: var(--text-lg); font-weight: 600; color: var(--fg);
  letter-spacing: -0.04em;
  margin-bottom: var(--space-4);
}
.news-day .date .meta {
  font-weight: 400; font-size: var(--text-xs); color: var(--muted);
  margin-left: var(--space-2); letter-spacing: normal;
}

.news-industry { margin-bottom: var(--space-4); }
.news-industry:last-child { margin-bottom: 0; }

.news-industry .ind-title {
  font-size: var(--text-xs); font-weight: 500; color: var(--meta);
  letter-spacing: 0.02em;
  margin-bottom: var(--space-1); display: flex; align-items: center; gap: 6px;
}
.news-industry .ind-title .count { font-weight: 400; color: var(--meta); }

.news-item {
  padding: 8px 0; cursor: pointer; transition: background var(--motion-fast);
  border-radius: var(--radius-sm);
  padding-left: var(--space-2); padding-right: var(--space-2);
  margin: 0 calc(-1 * var(--space-2));
  position: relative;
}
.news-item + .news-item { box-shadow: 0 -1px 0 0 var(--border-soft); }
.news-item:hover { background: rgba(0,0,0,0.02); }
.news-item .title {
  font-size: var(--text-sm); line-height: 1.5; margin-bottom: 1px;
  display: flex; align-items: flex-start; gap: 6px;
}
.news-item .summary {
  font-size: var(--text-sm); color: var(--muted); line-height: 1.6;
  display: none; margin-top: var(--space-1);
}
.news-item.expanded .summary { display: block; }

.spec-tag {
  font-size: 10px; font-weight: 500;
  background: rgba(217,119,6,0.10);
  color: var(--warn); padding: 1px 6px; border-radius: 3px;
  flex-shrink: 0; margin-top: 2px;
}

/* ══════════════════════════════════════════════════════════════
   MODEL GRID (Vercel cards)
   ══════════════════════════════════════════════════════════════ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}

.entity-card {
  background: var(--surface); border: none;
  box-shadow: var(--elev-raised);
  border-radius: var(--radius-md); padding: var(--space-4);
  transition: box-shadow var(--motion-base) var(--ease-standard);
}
.entity-card:hover {
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.12),
    0 2px 4px rgba(0, 0, 0, 0.06),
    0 12px 12px -8px rgba(0, 0, 0, 0.06),
    0 0 0 1px #fafafa;
}
.entity-card .name { font-size: var(--text-sm); font-weight: 500; margin-bottom: 3px; }
.entity-card .name a { color: var(--fg); }
.entity-card .name a:hover { color: var(--accent); }
.entity-card .vendor { font-size: var(--text-xs); color: var(--muted); margin-bottom: var(--space-2); }
.entity-card .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: var(--space-2); }

.tag {
  font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px;
  background: var(--accent-glow); color: var(--accent);
  letter-spacing: 0.01em;
}
.tag.cn { background: rgba(22,163,74,0.10); color: var(--success); }
.tag.special { background: rgba(217,119,6,0.10); color: var(--warn); }

.entity-card .meta {
  font-size: var(--text-xs); color: var(--muted);
  display: flex; gap: var(--space-2); flex-wrap: wrap;
}
.entity-card .meta span { display: flex; align-items: center; gap: 3px; }
.entity-card .links { margin-top: var(--space-3); display: flex; gap: var(--space-2); }
.entity-card .links a {
  font-size: var(--text-xs); color: var(--accent);
  padding: 2px 9px;
  box-shadow: var(--elev-ring);
  border-radius: var(--radius-sm);
  transition: background var(--motion-fast);
  text-decoration: none;
}
.entity-card .links a:hover { background: var(--accent-glow); }

/* ══════════════════════════════════════════════════════════════
   ROBOT TABLE (Vercel: clean mono table)
   ══════════════════════════════════════════════════════════════ */
.robot-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: var(--text-xs);
  font-family: var(--font-mono);
}
.robot-table th {
  background: var(--bg); color: var(--meta); font-weight: 500;
  text-align: left; padding: 8px 10px;
  box-shadow: 0 1px 0 0 var(--border);
  position: sticky; top: 0; z-index: 2; cursor: pointer;
  white-space: nowrap; font-size: 11px;
  transition: color var(--motion-fast);
}
.robot-table th:hover { color: var(--fg); }
.robot-table td {
  padding: 8px 10px;
  font-size: 11px;
}
.robot-table tr + tr td { box-shadow: 0 -1px 0 0 var(--border-soft); }
.robot-table tr:hover td { background: rgba(0,0,0,0.015); }

/* ══════════════════════════════════════════════════════════════
   BRAND CARDS (Vercel: elevated clickable cards)
   ══════════════════════════════════════════════════════════════ */
.brand-cards {
  display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4);
}
.brand-card {
  background: var(--surface); border: none;
  box-shadow: var(--elev-ring);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  min-width: 140px;
  cursor: pointer;
  transition: box-shadow var(--motion-base) var(--ease-standard);
  display: flex; flex-direction: column; gap: 2px;
}
.brand-card:hover {
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.12),
    0 2px 4px rgba(0, 0, 0, 0.06),
    0 0 0 1px #fafafa;
}
.brand-card .name {
  font-size: var(--text-sm); font-weight: 600; color: var(--fg);
  letter-spacing: -0.03em;
}
.brand-card .count { font-size: var(--text-xs); color: var(--muted); }
.brand-card .link {
  font-size: var(--text-xs); color: var(--accent); margin-top: var(--space-1);
  transition: color var(--motion-fast); text-decoration: none;
}
.brand-card .link:hover { color: var(--accent-hover); text-decoration: underline; }

/* Robot category tabs */
.cat-tabs {
  display: flex; gap: var(--space-1); flex-wrap: wrap; margin-bottom: var(--space-4);
}
.cat-tabs button {
  background: var(--bg); border: none;
  box-shadow: var(--elev-ring);
  color: var(--muted);
  font-size: var(--text-xs); font-family: inherit; font-weight: 500;
  padding: 6px 14px; cursor: pointer; border-radius: var(--radius-sm);
  transition: all var(--motion-fast);
}
.cat-tabs button:hover { color: var(--fg); box-shadow: 0 0 0 1px rgba(0,0,0,0.12); }
.cat-tabs button.active {
  color: var(--accent-on); background: var(--fg);
  box-shadow: none; font-weight: 500;
}

/* Column toggles */
.col-toggles {
  display: flex; gap: 4px; flex-wrap: wrap;
  padding: var(--space-2) var(--space-4);
  background: var(--surface); border: none;
  box-shadow: var(--elev-ring);
  border-radius: var(--radius-md); margin-bottom: var(--space-2);
}
.col-toggles label {
  font-size: var(--text-xs); color: var(--muted);
  display: flex; align-items: center;
  gap: 3px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  transition: background var(--motion-fast);
}
.col-toggles label:hover { background: rgba(0,0,0,0.02); }
.col-toggles input { accent-color: var(--fg); }

/* Pagination (Vercel: shadow-border buttons) */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: var(--space-2); padding: var(--space-4) 0; margin-top: var(--space-2);
}
.pagination button {
  background: var(--bg); border: none;
  box-shadow: var(--elev-ring);
  color: var(--muted);
  padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: var(--text-xs); font-family: inherit; font-weight: 500;
  transition: all var(--motion-fast);
}
.pagination button:hover:not(:disabled) { color: var(--fg); box-shadow: 0 0 0 1px rgba(0,0,0,0.12); }
.pagination button:disabled { opacity: .3; cursor: default; }
.pagination .page-info {
  font-size: var(--text-xs); color: var(--muted);
  padding: 0 var(--space-2);
  font-family: var(--font-body);
}
.pagination .page-info b { color: var(--fg); font-weight: 600; }

/* ══════════════════════════════════════════════════════════════
   ECOSYSTEM OVERLAY
   ══════════════════════════════════════════════════════════════ */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.50); z-index: 1000;
  backdrop-filter: blur(4px);
  animation: overlay-in .2s var(--ease-standard);
}
.overlay.show { display: block; }

@keyframes overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.overlay-content {
  background: var(--surface); border: none;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.08),
    0 16px 32px rgba(0, 0, 0, 0.12);
  border-radius: var(--radius-lg); padding: var(--space-6);
  margin: 40px auto;
  width: 92%; max-width: 680px; max-height: 80vh; overflow-y: auto;
  animation: panel-in .25s var(--ease-standard);
}

@keyframes panel-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .overlay, .overlay-content { animation: none; }
}

/* ── Skills ── */
.skill-card {
  background: var(--surface); border: none;
  box-shadow: var(--elev-raised);
  border-radius: var(--radius-md); padding: var(--space-4);
  margin-bottom: var(--space-3);
  transition: box-shadow var(--motion-base) var(--ease-standard);
}
.skill-card:hover {
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.12),
    0 2px 4px rgba(0, 0, 0, 0.06),
    0 12px 12px -8px rgba(0, 0, 0, 0.06),
    0 0 0 1px #fafafa;
}
.skill-card .name { font-size: var(--text-sm); font-weight: 600; color: var(--fg); letter-spacing: -0.03em; }
.skill-card .desc { font-size: var(--text-sm); color: var(--muted); margin: var(--space-1) 0; line-height: 1.5; }
.skill-card .reason { font-size: var(--text-sm); color: var(--fg); margin-top: var(--space-1); line-height: 1.5; }

/* ── Loading skeleton ── */
.skeleton {
  background: linear-gradient(90deg, transparent 25%, rgba(0,0,0,0.02) 50%, transparent 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.4s ease infinite;
  border-radius: 4px;
}
.skeleton-line { height: 14px; margin-bottom: 8px; width: 100%; }
.skeleton-line.short { width: 60%; }

@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--meta); }
.empty-state h3 { font-size: var(--text-base); color: var(--muted); margin-bottom: var(--space-1); }
.empty-state p { font-size: var(--text-sm); }

<script>
// ── DATA ───────────────────────────────────────────────────────────
let state = { models: [], robots: [], news: [], skills: [] };
let searchResults = null;

async function loadJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function init() {
  const [models, robots, news, skills] = await Promise.all([
    loadJSON('./models/manual_models.json'),
    loadJSON('./robots/manual_robots.json'),
    loadJSON('./xwlb.json'),
    loadJSON('./skills.json'),
  ]);

  state.models = models || [];
  state.robots = robots || [];
  state.news = news || { days: [] };
  state.skills = skills || [];

  document.getElementById('updateStatus').textContent =
    `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;

  document.getElementById('modelsBadge').textContent = state.models.length;
  document.getElementById('skillsBadge').textContent = state.skills.length;

  renderModels();
  renderNews();
  renderSkills();

  // Load initial robot category
  loadRobotCategory('humanoid').then(data => {
    state.robots = data;
    document.getElementById('robotsBadge').textContent = state.robots.length;
    renderRobots();
    document.getElementById('updateStatus').textContent =
      `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;
  });

  loadEcosystem();
}

// ── TAB SWITCHING ──────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => {
      t.classList.remove('active');
      void t.offsetWidth;
    });
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── GLOBAL SEARCH ──────────────────────────────────────────────────
const SEARCHABLE_FIELDS = ['标题','title','型号','厂商','名称','model_name','vendor','desc','reason'];

document.getElementById('globalSearch').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const container = document.getElementById('newsContainer');
  if (!q || q.length < 2) {
    searchResults = null;
    renderNews();
    return;
  }

  const data = state.news;
  if (!data.days) return;

  const results = [];
  data.days.forEach(day => {
    const matchingInds = (day.industries||[])
      .map(ind => {
        const matchingItems = (ind.items||[]).filter(item =>
          (item.title||'').toLowerCase().includes(q) ||
          (item.summary||'').toLowerCase().includes(q)
        );
        return matchingItems.length ? { ...ind, items: matchingItems } : null;
      })
      .filter(Boolean);
    if (matchingInds.length) {
      results.push({ ...day, industries: matchingInds, _total: matchingInds.reduce((a,i) => a+i.items.length, 0) });
    }
  });

  searchResults = { days: results };

  if (!results.length) {
    container.innerHTML = `<div class="empty-state">
      <h3>🔍 未找到"${q}"的相关新闻</h3>
      <p>试试其他关键词</p>
    </div>`;
    return;
  }

  renderNews();
});

// ── FILTER HELPERS ─────────────────────────────────────────────────
function populateSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

// ══════════════════════════════════════════════════════════════════
// MODELS
// ══════════════════════════════════════════════════════════════════
function renderModels() {
  const models = state.models;
  if (!models.length) return;

  const caps = [...new Set(models.map(m => m.capability_type).filter(Boolean))];
  const vendors = [...new Set(models.map(m => m.vendor).filter(Boolean))];
  populateSelect('mfCapability', caps);
  populateSelect('mfVendor', vendors);

  function filterModels() {
    const cap = document.getElementById('mfCapability').value;
    const dom = document.getElementById('mfDomestic').value;
    const ven = document.getElementById('mfVendor').value;
    const sort = document.getElementById('mfSort').value;

    let list = models.filter(m => {
      if (cap !== 'all' && m.capability_type !== cap) return false;
      if (dom !== 'all' && m.domestic_availability !== dom) return false;
      if (ven !== 'all' && m.vendor !== ven) return false;
      return true;
    });

    list.sort((a,b) => {
      if (sort === 'name') return a.model_name.localeCompare(b.model_name);
      const getPrice = (s) => parseFloat((s||'').replace(/[^0-9.]/g,'')) || 99999;
      return sort === 'price_asc' ? getPrice(a.output_price) - getPrice(b.output_price)
                                    : getPrice(b.output_price) - getPrice(a.output_price);
    });

    document.getElementById('modelStats').innerHTML =
      `<span>共 <b>${list.length}</b> 个模型</span>`;

    const grid = document.getElementById('modelGrid');
    grid.innerHTML = list.map(m => `
      <div class="entity-card">
        <div class="name"><a href="${m.official_url||'#'}" target="_blank">${m.model_name}</a></div>
        <div class="vendor">${m.vendor||''}</div>
        <div class="tags">
          ${m.capability_type ? `<span class="tag">${m.capability_type}</span>` : ''}
          ${m.domestic_availability === '直连' ? `<span class="tag cn">${m.domestic_availability}</span>`
            : m.domestic_availability ? `<span class="tag">${m.domestic_availability}</span>` : ''}
        </div>
        <div class="meta">
          ${m.output_price ? `<span>💰 ${m.output_price}</span>` : ''}
          ${m.context_window ? `<span>📏 ${m.context_window}</span>` : ''}
        </div>
        ${m.promotions ? `<div style="font-size:11px;color:var(--warn);margin-top:4px">🏷 ${m.promotions}</div>` : ''}
        <div class="links">
          ${m.official_url ? `<a href="${m.official_url}" target="_blank">官网</a>` : ''}
          ${m.tech_report_url ? `<a href="${m.tech_report_url}" target="_blank">技术报告</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  ['mfCapability','mfDomestic','mfVendor','mfSort'].forEach(id => {
    document.getElementById(id).addEventListener('change', filterModels);
  });
  filterModels();
}

// ══════════════════════════════════════════════════════════════════
// ROBOTS
// ══════════════════════════════════════════════════════════════════

let ecosystemData = null;

async function loadEcosystem() {
  if (ecosystemData) return ecosystemData;
  try {
    const r = await fetch('./robots/brand_ecosystem.json');
    if (!r.ok) return null;
    const d = await r.json();
    ecosystemData = d;
    return d;
  } catch(e) { return null; }
}

function getBrandEcosystem(vendor) {
  if (!ecosystemData) return null;
  const v = vendor.replace(/[()（]/g,'(').replace(/[)）]/g,')').toLowerCase();
  return ecosystemData.brands.find(b => b.name.replace(/[()（]/g,'(').replace(/[)）]/g,')').toLowerCase() === v) || null;
}

function closeEcosystem() {
  document.getElementById('ecosystemOverlay').classList.remove('show');
}

function showEcosystemPanel(vendor) {
  const eco = getBrandEcosystem(vendor);
  const overlay = document.getElementById('ecosystemOverlay');
  const panel = document.getElementById('ecosystemPanel');
  if (!eco) {
    panel.innerHTML = `<div style="text-align:center;padding:30px;color:var(--meta)">暂无 ${vendor} 的生态数据</div>
      <div style="text-align:center;margin-top:12px"><button onclick="closeEcosystem()" style="background:var(--fg);border:none;color:#fff;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px">关闭</button></div>`;
    overlay.classList.add('show');
    return;
  }

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:18px;color:var(--fg);margin:0;letter-spacing:-0.04em">${eco.name}</h2>
    <span style="font-size:11px;color:var(--success);letter-spacing:0.02em">● ${eco.ecosystem.open_source_degree}</span>
    <button onclick="closeEcosystem()" style="background:none;border:none;color:var(--meta);font-size:20px;cursor:pointer;line-height:1">✕</button>
  </div>`;

  // Datasets
  if (eco.ecosystem.datasets && eco.ecosystem.datasets.length) {
    html += `<div class="vc-card" style="margin-bottom:12px"><div class="vc-card-header">训练数据集</div>`;
    eco.ecosystem.datasets.forEach(d => {
      html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;box-shadow:0 -1px 0 0 var(--border-soft)">
        <span style="color:${d.open_source?'var(--success)':'var(--meta)'}">${d.open_source?'🔓':'🔒'}</span>
        <span style="font-weight:500">${d.name}</span>
        <span style="font-size:11px;color:var(--muted)">${d.type}</span>
        ${d.scale ? `<span style="font-size:11px;color:var(--accent)">${d.scale}</span>` : ''}
        ${d.url ? `<a href="${d.url}" target="_blank" style="font-size:11px;color:var(--accent)">详情</a>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Models
  if (eco.ecosystem.models && eco.ecosystem.models.length) {
    html += `<div class="vc-card" style="margin-bottom:12px"><div class="vc-card-header">基础模型</div>`;
    eco.ecosystem.models.forEach(m => {
      html += `<div style="padding:6px 0;box-shadow:0 -1px 0 0 var(--border-soft)">
        <div><span style="font-weight:500">${m.name}</span> <span style="font-size:11px;color:var(--muted)">${m.type}</span> ${m.open_source?'<span style="font-size:10px;color:var(--success);letter-spacing:0.02em">开源</span>':'<span style="font-size:10px;color:var(--warn);letter-spacing:0.02em">闭源</span>'}</div>
        ${m.capabilities ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${m.capabilities}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Key events
  if (eco.ecosystem.key_events && eco.ecosystem.key_events.length) {
    html += `<div class="vc-card" style="margin-bottom:12px"><div class="vc-card-header">关键事件</div>`;
    const sorted = [...eco.ecosystem.key_events].sort((a,b) => b.date.localeCompare(a.date));
    sorted.forEach(e => {
      html += `<div style="display:flex;gap:12px;padding:5px 0;box-shadow:0 -1px 0 0 var(--border-soft)">
        <span style="font-size:11px;color:var(--accent);min-width:80px;flex-shrink:0;font-family:var(--font-mono)">${e.date.replace('00','?')}</span>
        <span style="font-size:13px;color:var(--fg)">${e.event}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Open source & ROS
  html += `<div style="display:flex;gap:16px;font-size:12px;color:var(--muted);padding:8px 0;letter-spacing:0.02em">
    <span>🔧 ROS集成: ${eco.ecosystem.ros}</span>
    <span>📋 开源程度: ${eco.ecosystem.open_source_degree}</span>
  </div>`;

  panel.innerHTML = html;
  overlay.classList.add('show');
}

let robotData = {};
let currentRobotCat = 'humanoid';
let robotSortKey = null;
let robotSortAsc = true;

async function loadRobotCategory(cat) {
  const cfg = ROBOT_CONFIG[cat];
  if (!cfg) return [];
  if (robotData[cat]) return robotData[cat];
  const resp = await fetch(`./robots/${cfg.file}`);
  if (!resp.ok) return [];
  const data = await resp.json();
  robotData[cat] = data;
  return data;
}

function renderRobots() {
  const robots = state.robots || [];
  const cfg = ROBOT_CONFIG[currentRobotCat];
  if (!cfg || !robots.length) {
    document.getElementById('robotBody').innerHTML =
      '<tr><td colspan="10" style="text-align:center;color:var(--meta);padding:40px">暂无数据</td></tr>';
    return;
  }

  const visibleCols = getVisibleCols();

  // Brand cards
  const brands = {};
  robots.forEach(r => {
    const vendor = r['厂商'] || '未知';
    if (!brands[vendor]) brands[vendor] = { count: 0, url: r['官网'] || '#' };
    brands[vendor].count++;
  });

  document.getElementById('brandCards').innerHTML =
    Object.entries(brands).map(([name, info]) => `
      <div class="brand-card" onclick="showEcosystemPanel('${name.replace(/'/g,"\\'")}')">
        <div class="name">${name}</div>
        <div class="count">${info.count}款型号</div>
        <span class="link">查看品牌档案 ▶</span>
      </div>
    `).join('');

  // Type 2 filter
  const type2s = [...new Set(robots.map(r => r['类型']||r['形态']||'').filter(Boolean))];
  const sel = document.getElementById('rfType2');
  const oldVal = sel.value;
  sel.innerHTML = '<option value="all">全部</option>' +
    type2s.map(t => `<option value="${t}">${t}</option>`).join('');
  sel.value = type2s.includes(oldVal) ? oldVal : 'all';

  // Column toggles
  document.getElementById('colToggles').innerHTML =
    cfg.allCols.map(c => `
      <label><input type="checkbox" class="col-toggle" data-key="${c.key}"
        ${visibleCols.includes(c.key)?'checked':''}> ${c.label}</label>
    `).join('');

  document.querySelectorAll('.col-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      saveVisibleCols();
      renderRobots();
    });
  });

  // Filter
  const type2 = document.getElementById('rfType2').value;
  const status = document.getElementById('rfStatus').value;

  let list = robots.filter(r => {
    if (type2 !== 'all') {
      const t = r['类型'] || r['形态'] || '';
      if (t !== type2) return false;
    }
    if (status !== 'all') {
      const s = (r['状态']||'').toLowerCase();
      if (status === '已量产' && !s.includes('量产') && !s.includes('在售')) return false;
      if (status === '预售' && !s.includes('预售')) return false;
      if (status === '原型' && !s.includes('原型') && !s.includes('测试')) return false;
    }
    return true;
  });

  // Sort
  if (robotSortKey) {
    list.sort((a, b) => {
      let va = a[robotSortKey] || '', vb = b[robotSortKey] || '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return robotSortAsc ? na - nb : nb - na;
      return robotSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  // Pagination
  const pageSize = 10;
  const totalPages = Math.ceil(list.length / pageSize) || 1;
  if (robotPage >= totalPages) robotPage = 0;
  const page = robotPage;
  const pageList = list.slice(page * pageSize, (page + 1) * pageSize);

  // Stats
  document.getElementById('robotStatsLeft').innerHTML =
    `<span>共 <b>${list.length}</b> 个型号（本类共${robots.length}个）</span>`;
  document.getElementById('robotPageInfo').innerHTML =
    `第 <b>${page + 1}</b> / <b>${totalPages}</b> 页（每页${pageSize}条）`;
  document.getElementById('robotPrev').disabled = page === 0;
  document.getElementById('robotNext').disabled = page >= totalPages - 1;

  // Table header
  const sortedCol = cfg.allCols.filter(c => visibleCols.includes(c.key));
  document.getElementById('robotThead').innerHTML = '<tr>' +
    sortedCol.map(c => {
      const isSorted = robotSortKey === c.key;
      const arrow = isSorted ? (robotSortAsc ? ' ↑' : ' ↓') : '';
      return `<th onclick="sortRobot('${c.key}')" style="cursor:pointer${c.sort?'':';cursor:default'}">${c.label}${arrow}${c.sort?' ▾':''}</th>`;
    }).join('') + '</tr>';

  // Table body
  document.getElementById('robotBody').innerHTML = pageList.map(r => {
    const vendorHtml = r['官网'] ? `<a href="${r['官网']}" target="_blank" style="color:var(--accent);text-decoration:none">${r['厂商']||''}</a>` : (r['厂商']||'');
    const level = r['数据级别'] || '';
    const levelBadge = level.includes('官方') ? '<span style="font-size:9px;color:var(--success);margin-left:4px">✓</span>'
      : level.includes('新闻') ? '<span style="font-size:9px;color:var(--warn);margin-left:4px">📰</span>'
      : '<span style="font-size:9px;color:var(--meta);margin-left:4px">?</span>';
    return '<tr>' + sortedCol.map(c => {
      if (c.key === '厂商') return `<td><span onclick="showEcosystemPanel('${(r['厂商']||'').replace(/'/g,"\\'")}')" style="cursor:pointer;color:var(--accent)">${r['厂商']||''}</span>${levelBadge}</td>`;
      if (c.key === '型号' && r['官网']) {
        return `<td><a href="${r['官网']}" target="_blank" style="color:var(--fg);text-decoration:none">${r['型号']||''}</a></td>`;
      }
      const val = r[c.key] || '';
      return `<td>${val}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function getVisibleCols() {
  const key = `robot_cols_${currentRobotCat}`;
  const saved = localStorage.getItem(key);
  if (saved) return JSON.parse(saved);
  return ROBOT_CONFIG[currentRobotCat].defaultCols;
}

function saveVisibleCols() {
  const checked = [...document.querySelectorAll('.col-toggle:checked')].map(cb => cb.dataset.key);
  localStorage.setItem(`robot_cols_${currentRobotCat}`, JSON.stringify(checked));
}

let robotPage = 0;
const ROBOT_PAGE_SIZE = 10;
function robotPagePrev() { if (robotPage > 0) { robotPage--; renderRobots(); } }
function robotPageNext() { robotPage++; renderRobots(); }

function sortRobot(key) {
  const col = ROBOT_CONFIG[currentRobotCat].allCols.find(c => c.key === key);
  if (!col || !col.sort) return;
  if (robotSortKey === key) robotSortAsc = !robotSortAsc;
  else { robotSortKey = key; robotSortAsc = true; }
  renderRobots();
}

// Robot category switching
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('robotCatTabs')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.cat) return;

    document.querySelectorAll('#robotCatTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentRobotCat = btn.dataset.cat;
    robotSortKey = null;
    robotSortAsc = true;
    robotPage = 0;

    state.robots = await loadRobotCategory(currentRobotCat);
    document.getElementById('robotsBadge').textContent = state.robots.length;
    document.getElementById('updateStatus').textContent =
      `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${(state.news.days||[]).length}天新闻 · ${state.skills.length}技能`;
    renderRobots();
  });

  ['rfType2', 'rfStatus'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => renderRobots());
  });
});

// NEWS
// ══════════════════════════════════════════════════════════════════
function renderNews() {
  const data = searchResults || state.news;
  if (!data.days || !data.days.length) {
    document.getElementById('newsContainer').innerHTML =
      '<div class="empty-state"><h3>暂无新闻数据</h3><p>数据采集中...</p></div>';
    return;
  }

  if (!searchResults) {
    const inds = [...new Set(state.news.days.flatMap(d => (d.industries||[]).map(i => i.name)))];
    const sel = document.getElementById('newsIndustry');
    if (sel.options.length <= 1) {
      populateSelect('newsIndustry', inds);
    }
  }

  function filterNews() {
    const src = document.getElementById('newsSource').value;
    const ind = document.getElementById('newsIndustry').value;
    const spec = document.getElementById('newsSpecial').checked;

    let days = data.days;
    if (src !== 'all') { days = days.filter(d => d.source === src); }
    if (spec) { days = days.filter(d => d.special_count > 0); }

    const container = document.getElementById('newsContainer');
    container.innerHTML = days.map(day => {
      let industries = day.industries || [];
      if (ind !== 'all') { industries = industries.filter(i => i.name === ind); }
      if (!industries.length) return '';

      return `<div class="news-day">
        <div class="date">📺 ${day.date.replace(/(\d{4})(\d{2})(\d{2})/,'$1年$2月$3日')}
          <span class="meta">${day.total_items}条 · ${day.industry_count}个行业 ${day.special_count>0?' 🔔'+day.special_count+'条特别关注':''}</span>
        </div>
        ${industries.map(ind2 => `
          <div class="news-industry">
            <div class="ind-title">📌 ${ind2.name} <span class="count">${ind2.count}条${ind2.special?' 🔔':''}</span></div>
            ${(ind2.items||[]).map(item => `
              <div class="news-item" onclick="this.classList.toggle('expanded')">
                <div class="title">${item.title||''}${item.special?'<span class="spec-tag">🔔 特别关注</span>':''}</div>
                <div class="summary">${item.summary||''}</div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }

  if (!window._newsListenersAttached) {
    ['newsSource','newsIndustry'].forEach(id => {
      document.getElementById(id).addEventListener('change', filterNews);
    });
    document.getElementById('newsSpecial').addEventListener('change', filterNews);
    window._newsListenersAttached = true;
  }
  filterNews();
}

// ══════════════════════════════════════════════════════════════════
function renderSkills() {
  const scene = document.getElementById('sfScene').value;
  let list = state.skills;
  if (scene !== 'all') list = list.filter(s => s.scene === scene);

  const container = document.getElementById('skillsContainer');
  container.innerHTML = list.map(s => `
    <div class="skill-card">
      <div class="name">${s.name}</div>
      <div class="tags" style="margin:2px 0">
        <span class="tag">${s.scene === 'work' ? '工作' : s.scene === 'life' ? '生活' : '研究'}</span>
      </div>
      <div class="desc">${s.desc}</div>
      <div class="reason">💡 <strong>推荐理由：</strong>${s.reason}</div>
    </div>
  `).join('');
}

document.getElementById('sfScene')?.addEventListener('change', renderSkills);
