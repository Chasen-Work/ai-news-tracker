.search-panel .sp-item{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-radius:var(--radius-sm);transition:background var(--motion-fast);font-size:var(--text-sm)}
.search-panel .sp-item:hover{background:rgba(0,0,0,0.04)}
.search-panel .sp-item .sp-tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500;flex-shrink:0}

.sp-item em{font-style:normal;background:rgba(0,112,243,0.12);color:var(--accent);padding:0 2px;border-radius:2px}

@media(max-width:768px){.search-panel{position:fixed;top:56px;left:0;right:0;max-height:calc(100vh - 60px);border-radius:0;box-shadow:0 4px 24px rgba(0,0,0,0.15)}}

</head>
<body>

<div class="app-header">
  <div class="header-inner">
    <div class="header-brand">
      <h1>AI<span>HOT</span></h1>
      <div class="sub">机器人 · 模型 · 新闻 · 技能</div>
    </div>
    <div class="header-center">
      <div class="search-bar">
        <input type="text" id="globalSearch" placeholder="搜索机器人、模型、新闻..." autocomplete="off">

      </div>
    </div>
    <div class="header-right">
      <span class="status-dot" id="updateStatus">数据加载中...</span>
    </div>
  </div>

<div class="tab-bar" id="tabs">

  <button class="tab-btn" data-tab="models">🧠 模型选型 <span class="badge" id="modelsBadge">0</span></button>
  <button class="tab-btn" data-tab="news">📺 新闻 <span class="badge" id="newsBadge">0</span></button>
  <button class="tab-btn" data-tab="skills">🛠 技能推荐 <span class="badge" id="skillsBadge">0</span></button>
</div>

<div class="main">

<!-- ══════════════ TAB 1: ROBOTS (DEFAULT) ══════════════ -->
<div class="tab-content active" id="tab-robots">
  <!-- Category tabs -->
  <div class="cat-tabs" id="robotCatTabs">
    <button class="active" data-cat="humanoid">🤖 人形机器人</button>
    <button data-cat="commercial_cleaner">🧹 商用清洁</button>
    <button data-cat="industrial_quadruped">🐕 四足工业</button>
    <button data-cat="delivery_vehicle">🚚 无人配送车</button>
    <button data-cat="ai_toy">🧸 AI玩具</button>

  <!-- Brand strip -->
  <div class="brand-cards" id="brandCards"></div>

  <!-- Quick filter pills -->
  <div class="quick-filters" id="quickFilters"></div>

  <!-- Standard filters -->
  <div class="filters" id="robotFilters">

      <select id="rfType2"><option value="all">全部</option></select>
    </label>
    <label>状态：
      <select id="rfStatus">
        <option value="all">全部状态</option>
        <option value="已量产">已量产</option>
        <option value="预售">预售中</option>

    <label style="margin-left:auto;font-size:11px;color:var(--meta)">

  <!-- Column toggles -->

      <thead id="robotThead"></thead>
      <tbody id="robotBody"></tbody>
    </table>

  <!-- Pagination -->
  <div class="pagination" id="robotPagination">
    <button id="robotPrev" onclick="robotPagePrev()">‹ 上一页</button>
    <span class="page-info" id="robotPageInfo">第 <b>1</b> / <b>1</b> 页</span>
    <button id="robotNext" onclick="robotPageNext()">下一页 ›</button>

</div>

<!-- ══════════════ TAB 2: MODELS ══════════════ -->
<div class="tab-content" id="tab-models">
  <div class="filters" id="modelFilters">
    <label>能力：<select id="mfCapability"><option value="all">全部能力</option></select></label>
    <label>国内可用：<select id="mfDomestic"><option value="all">全部</option><option value="直连">直连</option><option value="需代理">需代理</option></select></label>
    <label>厂商：<select id="mfVendor"><option value="all">全部厂商</option></select></label>
    <label>排序：<select id="mfSort"><option value="price">价格↓</option><option value="price_asc">价格↑</option><option value="name">名称</option></select></label>

<!-- ══════════════ TAB 3: NEWS ══════════════ -->
<div class="tab-content" id="tab-news">
  <div class="filters" id="newsFilters">
    <label>来源：<select id="newsSource"><option value="all">全部</option><option value="xwlb">新闻联播</option><option value="global">全球动态</option></select></label>
    <label>行业：<select id="newsIndustry"><option value="all">全部行业</option></select></label>

    <div class="vc-card" style="text-align:center;padding:40px;color:var(--meta)">加载新闻数据中...</div>

</div>

<!-- ══════════════ TAB 4: SKILLS ══════════════ -->
<div class="tab-content" id="tab-skills">

  <div id="skillsContainer">

  </div>

</div><!-- /main -->

<!-- ══════════════ ECOSYSTEM OVERLAY ══════════════ -->
<div id="ecosystemOverlay" class="overlay" onclick="if(event.target===this)closeEcosystem()">
  <div class="overlay-content" id="ecosystemPanel" style="max-width:680px;max-height:80vh;overflow-y:auto"></div>
</div>

<!-- ══════════════ COMPARE OVERLAY ══════════════ -->
<div id="compareOverlay" class="overlay" onclick="if(event.target===this)closeCompare()">
  <div class="overlay-content" id="comparePanel" style="max-width:1100px;max-height:85vh;overflow-y:auto"></div>
</div>

<!-- ══════════════ COMPARE FLOATING BAR ══════════════ -->
<div class="cmp-bar" id="cmpBar">
  <div class="cmp-bar-inner">
    <span>已选 <span class="cmp-count" id="cmpCount">0</span> 个型号</span>
    <button id="cmpBtn" onclick="openCompare()" disabled>对比</button>
    <button class="cmp-clear" onclick="clearCompare()">清空</button>
  </div>
</div>

<script>
// ── DATA ───────────────────────────────────────────────────────────
let state = { models: [], robots: [], news: [], skills: [] };
let searchResults = null;
let compareList = []; // array of selected robot keys (厂商+型号)

async function loadJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch(e) { return null; }
}

async function init() {
  const [models, robots, news, skills] = await Promise.all([
    loadJSON('./models/manual_models.json'),
    loadJSON('./robots/manual_robots.json'),
    loadJSON('./xwlb.json'),
    loadJSON('./skills.json'),
  ]);
  state.models = models || [];
  state.robots = robots || [];
  state.news = news || { days: [] };
  state.skills = skills || [];

  updateStats();

  renderModels();
  renderNews();
  renderSkills();

  loadRobotCategory('humanoid').then(data => {
    state.robots = data;
    updateStats();
    renderRobots();
  });

  loadEcosystem();
}

function updateStats() {
  const nd = (state.news.days||[]).length;
  document.getElementById('updateStatus').textContent =
    `● ${state.models.length}模型 · ${state.robots.length}机器人 · ${nd}天新闻 · ${state.skills.length}技能`;
  document.getElementById('modelsBadge').textContent = state.models.length;
  document.getElementById('robotsBadge').textContent = state.robots.length;
  document.getElementById('newsBadge').textContent = nd;
  document.getElementById('skillsBadge').textContent = state.skills.length;
}

// ── TAB SWITCHING ──────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => { t.classList.remove('active'); void t.offsetWidth; });
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── FILTER HELPERS ─────────────────────────────────────────────────
function populateSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => { const opt = document.createElement('option'); opt.value = v; opt.textContent = v; sel.appendChild(opt); });
}

// ══════════════════════════════════════════════════════════════════
// ROBOTS - MAIN FUNCTION
// ══════════════════════════════════════════════════════════════════
let ecosystemData = null;

async function loadEcosystem() {
  if (ecosystemData) return ecosystemData;
  try { const r = await fetch('./robots/brand_ecosystem.json'); if (!r.ok) return null; const d = await r.json(); ecosystemData = d; return d; }
  catch(e) { return null; }
}

function getBrandEcosystem(vendor) {
  if (!ecosystemData) return null;
  const v = vendor.replace(/[()（）]/g,'(').replace(/[)）]/g,')').toLowerCase();
  return ecosystemData.brands.find(b => b.name.replace(/[()（）]/g,'(').replace(/[)）]/g,')').toLowerCase() === v) || null;
}

function closeEcosystem() { document.getElementById('ecosystemOverlay').classList.remove('show'); }

function showEcosystemPanel(vendor) {
  const eco = getBrandEcosystem(vendor);
  const overlay = document.getElementById('ecosystemOverlay');
  const panel = document.getElementById('ecosystemPanel');
  if (!eco) {
    panel.innerHTML = `<div style="text-align:center;padding:30px;color:var(--meta)">暂无 ${vendor} 的生态数据</div>
      <div style="text-align:center;margin-top:12px"><button onclick="closeEcosystem()" style="background:var(--fg);border:none;color:#fff;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px">关闭</button></div>`;
    overlay.classList.add('show'); return;
  }
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:18px;color:var(--fg);margin:0;letter-spacing:-0.04em">${eco.name}</h2>
    <span style="font-size:11px;color:var(--success)">● ${eco.ecosystem.open_source_degree}</span>
    <button onclick="closeEcosystem()" style="background:none;border:none;color:var(--meta);font-size:20px;cursor:pointer;line-height:1">✕</button></div>`;
  if (eco.ecosystem.datasets && eco.ecosystem.datasets.length) {
    html += `<div class="vc-card" style="margin-bottom:12px"><div class="vc-card-header">训练数据集</div>`;
    eco.ecosystem.datasets.forEach(d => {
      html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;box-shadow:0 -1px 0 0 var(--border-soft)">
        <span style="color:${d.open_source?'var(--success)':'var(--meta)'}">${d.open_source?'🔓':'🔒'}</span>
        <span style="font-weight:500">${d.name}</span>
        <span style="font-size:11px;color:var(--muted)">${d.type}</span>
        ${d.scale ? `<span style="font-size:11px;color:var(--accent)">${d.scale}</span>` : ''}
        ${d.url ? `<a href="${d.url}" target="_blank" style="font-size:11px;color:var(--accent)">详情</a>` : ''}</div>`; });
    html += `</div>`;
  }
  if (eco.ecosystem.models && eco.ecosystem.models.length) {
    html += `<div class="vc-card" style="margin-bottom:12px"><div class="vc-card-header">基础模型</div>`;
    eco.ecosystem.models.forEach(m => {
      html += `<div style="padding:6px 0;box-shadow:0 -1px 0 0 var(--border-soft)">
        <div><span style="font-weight:500">${m.name}</span> <span style="font-size:11px;color:var(--muted)">${m.type}</span> ${m.open_source?'<span style="font-size:10px;color:var(--success)">开源</span>':'<span style="font-size:10px;color:var(--warn)">闭源</span>'}</div>
        ${m.capabilities ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${m.capabilities}</div>` : ''}</div>`; });
    html += `</div>`;
  }
  if (eco.ecosystem.key_events && eco.ecosystem.key_events.length) {
    html += `<div class="vc-card" style="margin-bottom:12px"><div class="vc-card-header">关键事件</div>`;
    const sorted = [...eco.ecosystem.key_events].sort((a,b) => b.date.localeCompare(a.date));
    sorted.forEach(e => {
      html += `<div style="display:flex;gap:12px;padding:5px 0;box-shadow:0 -1px 0 0 var(--border-soft)">
        <span style="font-size:11px;color:var(--accent);min-width:80px;flex-shrink:0;font-family:var(--font-mono)">${e.date.replace('00','?')}</span>
        <span style="font-size:13px;color:var(--fg)">${e.event}</span></div>`; });
    html += `</div>`;
  }
  html += `<div style="display:flex;gap:16px;font-size:12px;color:var(--muted);padding:8px 0">
    <span>🔧 ROS集成: ${eco.ecosystem.ros}</span>
    <span>📋 开源程度: ${eco.ecosystem.open_source_degree}</span></div>`;
  panel.innerHTML = html;
  overlay.classList.add('show');
}

    allCols: [
      {key:'厂商',label:'厂商',sort:true},{key:'型号',label:'型号',sort:true},

// Quick filter matching helpers
function matchPrice(r, cfg) {
  const v = document.querySelector(`.qf-pill[data-qf="${cfg.priceKey||'price'}"].active`);
  if (!v) return true;
  const val = parseFloat((r[cfg.priceKey]||'').replace(/[^0-9.]/g,''));
  if (isNaN(val)) return true;
  const opt = v.textContent;
  if (opt.startsWith('<')) return val < parseFloat(opt.slice(1));
  if (opt.startsWith('>')) return val > parseFloat(opt.slice(1));
  const parts = opt.split('-');
  if (parts.length === 2) return val >= parseFloat(parts[0]) && val <= parseFloat(parts[1]);
  return true;
}

let robotData = {};
let currentRobotCat = 'humanoid';
let robotSortKey = null;
let robotSortAsc = true;

async function loadRobotCategory(cat) {
  const cfg = ROBOT_CONFIG[cat];
  if (!cfg) return [];
  if (robotData[cat]) return robotData[cat];
  const resp = await fetch(`./robots/${cfg.file}`);
  if (!resp.ok) return [];
  const data = await resp.json();
  robotData[cat] = data;
  return data;
}

function renderRobots() {
  const robots = state.robots || [];
  let cfg = ROBOT_CONFIG[currentRobotCat];
  if (!cfg || !robots.length) {
    document.getElementById('robotBody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--meta);padding:40px">暂无数据</td></tr>';
    return;
  }

  const visibleCols = getVisibleCols();
  const showDiff = document.getElementById('showDiff').checked;

  // Brand cards
  const brands = {};
  robots.forEach(r => { const v = r['厂商']||'未知'; if(!brands[v]) brands[v]={count:0,url:r['官网']||'#'}; brands[v].count++; });
  document.getElementById('brandCards').innerHTML =
    Object.entries(brands).map(([name,info]) =>
      `<div class="brand-card" onclick="showEcosystemPanel('${name.replace(/'/g,"\\'")}')">
        <div class="name">${name}</div>
        <div class="count">${info.count}款</div>
      </div>`
    ).join('');

  // Quick filter pills
  const qfContainer = document.getElementById('quickFilters');
  qfContainer.innerHTML = cfg.quickFilters.map(g => {
    const qfKey = g.key;
    return `<div class="qf-group">
      <span class="qf-label">${g.label}</span>
      ${g.options.map(o => {
        const dataQf = o === '全部' ? '' : qfKey;
        return `<button class="qf-pill ${o==='全部'?'active':''}" data-qf="${dataQf}" data-value="${o}" onclick="toggleQuickFilter(this,'${qfKey}')">${o}</button>`;
      }).join('')}
    </div>`;
  }).join('');

  // Type 2 filter
  const type2s = [...new Set(robots.map(r => r['类型']||r['形态']||'').filter(Boolean))];
  const sel = document.getElementById('rfType2');
  const oldVal = sel.value;
  sel.innerHTML = '<option value="all">全部</option>' + type2s.map(t => `<option value="${t}">${t}</option>`).join('');
  sel.value = type2s.includes(oldVal) ? oldVal : 'all';

  // Column toggles
  document.getElementById('colToggles').innerHTML =
    cfg.allCols.map(c => `<label><input type="checkbox" class="col-toggle" data-key="${c.key}" ${visibleCols.includes(c.key)?'checked':''}> ${c.label}</label>`).join('');
  document.querySelectorAll('.col-toggle').forEach(cb => { cb.addEventListener('change', () => { saveVisibleCols(); renderRobots(); }); });

  // Filter
  const type2 = document.getElementById('rfType2').value;
  const status = document.getElementById('rfStatus').value;

  let list = robots.filter(r => {
    if (type2 !== 'all') { const t = r['类型']||r['形态']||''; if (t !== type2) return false; }
    if (status !== 'all') {
      const s = (r['状态']||'').toLowerCase();
      if (status === '已量产' && !s.includes('量产') && !s.includes('在售')) return false;
      if (status === '预售' && !s.includes('预售')) return false;
      if (status === '原型' && !s.includes('原型') && !s.includes('测试')) return false;
    }
    // Quick filters
    for (const g of cfg.quickFilters) {
      if (!cfg.matchQuickFilter(r, g.key)) return false;
    }
    return true;
  });

  // Show diff mode: find columns where all values are same
  let diffCols = null;
  if (showDiff && list.length >= 2) {
    diffCols = [];
    const keys = visibleCols.filter(k => k !== '厂商' && k !== '型号');
    keys.forEach(k => {
      const vals = [...new Set(list.map(r => (r[k]||'').toString().trim()))];
      if (vals.length >= 2) diffCols.push(k);
    });
  }

  // Sort
  if (robotSortKey) {
    list.sort((a,b) => {
      let va = a[robotSortKey]||'', vb = b[robotSortKey]||'';
      const na=parseFloat(va), nb=parseFloat(vb);
      if(!isNaN(na)&&!isNaN(nb)) return robotSortAsc?na-nb:nb-na;
      return robotSortAsc?va.localeCompare(vb):vb.localeCompare(va);
    });
  }

  // Pagination
  const pageSize = 10;
  const totalPages = Math.ceil(list.length / pageSize) || 1;
  if (robotPage >= totalPages) robotPage = 0;
  const page = robotPage;
  const pageList = list.slice(page*pageSize, (page+1)*pageSize);

  // Stats
  document.getElementById('robotStatsLeft').innerHTML = `<span>共 <b>${list.length}</b> 个型号（本类${robots.length}个）</span>`;
  document.getElementById('robotPageInfo').innerHTML = `第 <b>${page+1}</b> / <b>${totalPages}</b> 页（每页${pageSize}条）`;
  document.getElementById('robotPrev').disabled = page === 0;
  document.getElementById('robotNext').disabled = page >= totalPages - 1;

  // Table header (with compare checkbox column)
  const sortedCol = cfg.allCols.filter(c => visibleCols.includes(c.key));
  const showCols = showDiff && diffCols ? sortedCol.filter(c => c.key === '厂商'||c.key==='型号'||diffCols.includes(c.key)) : sortedCol;
  
  document.getElementById('robotThead').innerHTML = '<tr>' +
    `<th class="cmp-cell" style="cursor:default;width:30px"><input type="checkbox" id="cmpSelectAll" onchange="toggleSelectAll(this)" title="全选对比"></th>` +
    showCols.map(c => {
      const isSorted = robotSortKey === c.key;
      const arrow = isSorted?(robotSortAsc?' ↑':' ↓'):'';
      return `<th onclick="sortRobot('${c.key}')" style="cursor:pointer${c.sort?'':';cursor:default'}">${c.label}${arrow}${c.sort?' ▾':''}</th>`;
    }).join('') + '</tr>';

  // Table body
  document.getElementById('robotBody').innerHTML = pageList.map((r,idx) => {
    const rid = r['厂商']+'|'+r['型号'];
    const isCmp = compareList.includes(rid);
    const level = r['数据级别']||'';
    const levelBadge = level.includes('官方')?'<span style="font-size:9px;color:var(--success);margin-left:4px">✓</span>'
      : level.includes('新闻')?'<span style="font-size:9px;color:var(--warn);margin-left:4px">📰</span>'
      : '<span style="font-size:9px;color:var(--meta);margin-left:4px">?</span>';
    return '<tr>' +
      `<td class="cmp-cell"><input type="checkbox" class="cmp-check" data-rid="${rid}" ${isCmp?'checked':''} onchange="toggleCompare('${rid}',this.checked)"></td>` +
      showCols.map(c => {
        if (c.key === '厂商') return `<td><span onclick="showEcosystemPanel('${(r['厂商']||'').replace(/'/g,"\\'")}')" style="cursor:pointer;color:var(--accent)">${r['厂商']||''}</span>${levelBadge}</td>`;
        if (c.key === '型号' && r['官网']) return `<td><a href="${r['官网']}" target="_blank" style="color:var(--fg);text-decoration:none">${r['型号']||''}</a></td>`;
        const val = r[c.key]||'';
        return `<td>${val}</td>`;
      }).join('') + '</tr>';
  }).join('');
}

function toggleQuickFilter(btn, groupKey) {
  const siblings = btn.parentElement.querySelectorAll('.qf-pill');
  siblings.forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  renderRobots();
}

function toggleCompare(rid, checked) {
  if (checked) {
    if (!compareList.includes(rid)) compareList.push(rid);
  } else {
    compareList = compareList.filter(r => r !== rid);
  }
  updateCompareBar();
}

function toggleSelectAll(el) {
  const checked = el.checked;
  document.querySelectorAll('.cmp-check').forEach(cb => {
    cb.checked = checked;
    toggleCompare(cb.dataset.rid, checked);
  });
}

function clearCompare() {
  compareList = [];
  document.querySelectorAll('.cmp-check').forEach(cb => cb.checked = false);
  if (document.getElementById('cmpSelectAll')) document.getElementById('cmpSelectAll').checked = false;
  updateCompareBar();
}

function updateCompareBar() {
  const bar = document.getElementById('cmpBar');
  const count = document.getElementById('cmpCount');
  const btn = document.getElementById('cmpBtn');
  count.textContent = compareList.length;
  btn.disabled = compareList.length < 2;
  bar.classList.toggle('show', compareList.length > 0);
}

function openCompare() {
  if (compareList.length < 2) return;
  const robots = state.robots || [];
  const selected = compareList.map(rid => {
    const [vendor, model] = rid.split('|');
    return robots.find(r => (r['厂商']||'') === vendor && (r['型号']||'') === model);
  }).filter(Boolean);

  if (selected.length < 2) return;

  const cfg = ROBOT_CONFIG[currentRobotCat];
  const allKeys = cfg.allCols.map(c => c.key);

  // Build compare table: rows = parameters, columns = selected robots
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:18px;color:var(--fg);margin:0;letter-spacing:-0.04em">参数对比</h2>
    <button onclick="closeCompare()" style="background:none;border:none;color:var(--meta);font-size:20px;cursor:pointer">✕</button>
  </div>
  <div style="overflow-x:auto">
  <table class="cmp-table">
    <tr><th></th>${selected.map(r => `<th>${r['厂商']||''} ${r['型号']||''}</th>`).join('')}</tr>`;

  allKeys.forEach(key => {
    const colDef = cfg.allCols.find(c => c.key === key);
    if (!colDef) return;
    const vals = selected.map(r => (r[key]||'').toString().trim());
    const allSame = new Set(vals).size === 1;
    html += `<tr>
      <td>${colDef.label}</td>
      ${vals.map(v => `<td class="${allSame?'':'diff'}">${v||'-'}</td>`).join('')}
    </tr>`;
  });

  html += `</table></div>
    <div style="margin-top:16px;text-align:center">
      <button onclick="closeCompare()" style="background:var(--fg);border:none;color:#fff;padding:8px 24px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px">关闭对比</button>
    </div>`;

  document.getElementById('comparePanel').innerHTML = html;
  document.getElementById('compareOverlay').classList.add('show');
}

function closeCompare() {
  document.getElementById('compareOverlay').classList.remove('show');
}

function getVisibleCols() {
  const key = `robot_cols_${currentRobotCat}`;
  const saved = localStorage.getItem(key);
  if (saved) return JSON.parse(saved);
  return ROBOT_CONFIG[currentRobotCat].defaultCols;
}

function saveVisibleCols() {
  const checked = [...document.querySelectorAll('.col-toggle:checked')].map(cb => cb.dataset.key);
  localStorage.setItem(`robot_cols_${currentRobotCat}`, JSON.stringify(checked));
}

let robotPage = 0;
function robotPagePrev() { if(robotPage>0){robotPage--;renderRobots();} }
function robotPageNext() { robotPage++; renderRobots(); }

function sortRobot(key) {
  const col = ROBOT_CONFIG[currentRobotCat].allCols.find(c=>c.key===key);
  if(!col||!col.sort) return;
  if(robotSortKey===key) robotSortAsc=!robotSortAsc;
  else{robotSortKey=key;robotSortAsc=true;}
  renderRobots();
}

// Robot category switching
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('robotCatTabs')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.cat) return;
    document.querySelectorAll('#robotCatTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRobotCat = btn.dataset.cat;
    robotSortKey = null; robotSortAsc = true; robotPage = 0;
    compareList = []; updateCompareBar();
    state.robots = await loadRobotCategory(currentRobotCat);
    updateStats();
    renderRobots();
  });

  ['rfType2','rfStatus'].forEach(id => { document.getElementById(id)?.addEventListener('change', () => renderRobots()); });
});

function renderModels() {
  const models = state.models;
  if (!models.length) return;
  const caps = [...new Set(models.map(m=>m.capability_type).filter(Boolean))];
  const vendors = [...new Set(models.map(m=>m.vendor).filter(Boolean))];
  populateSelect('mfCapability', caps);
  populateSelect('mfVendor', vendors);

  function filterModels() {
    const cap = document.getElementById('mfCapability').value;
    const dom = document.getElementById('mfDomestic').value;
    const ven = document.getElementById('mfVendor').value;
    const sort = document.getElementById('mfSort').value;
    let list = models.filter(m => {
      if(cap!=='all'&&m.capability_type!==cap) return false;
      if(dom!=='all'&&m.domestic_availability!==dom) return false;
      if(ven!=='all'&&m.vendor!==ven) return false;
      return true;
    });
    list.sort((a,b) => {
      if(sort==='name') return a.model_name.localeCompare(b.model_name);
      const getPrice=(s)=>parseFloat((s||'').replace(/[^0-9.]/g,''))||99999;
      return sort==='price_asc'?getPrice(a.output_price)-getPrice(b.output_price):getPrice(b.output_price)-getPrice(a.output_price);
    });
    document.getElementById('modelStats').innerHTML = `<span>共 <b>${list.length}</b> 个模型</span>`;
    document.getElementById('modelGrid').innerHTML = list.map(m => `
      <div class="entity-card">
        <div class="name"><a href="${m.official_url||'#'}" target="_blank">${m.model_name}</a></div>
        <div class="vendor">${m.vendor||''}</div>
        <div class="tags">
          ${m.capability_type?`<span class="tag">${m.capability_type}</span>`:''}
          ${m.domestic_availability==='直连'?`<span class="tag cn">${m.domestic_availability}</span>`:m.domestic_availability?`<span class="tag">${m.domestic_availability}</span>`:''}
        </div>
        <div class="meta">
          ${m.output_price?`<span>💰 ${m.output_price}</span>`:''}
          ${m.context_window?`<span>📏 ${m.context_window}</span>`:''}
        </div>
        ${m.promotions?`<div style="font-size:11px;color:var(--warn);margin-top:4px">🏷 ${m.promotions}</div>`:''}
        <div class="links">
          ${m.official_url?`<a href="${m.official_url}" target="_blank">官网</a>`:''}
          ${m.tech_report_url?`<a href="${m.tech_report_url}" target="_blank">技术报告</a>`:''}
        </div>
      </div>
    `).join('');
  }
  ['mfCapability','mfDomestic','mfVendor','mfSort'].forEach(id => { document.getElementById(id).addEventListener('change', filterModels); });
  filterModels();
}

// ══════════════════════════════════════════════════════════════════
// NEWS
// ══════════════════════════════════════════════════════════════════
function renderNews() {
  const data = searchResults || state.news;
  if (!data.days || !data.days.length) {
    document.getElementById('newsContainer').innerHTML = '<div class="empty-state"><h3>暂无新闻数据</h3><p>数据采集中...</p></div>';
    return;
  }
  if (!searchResults) {
    const inds = [...new Set(state.news.days.flatMap(d=>(d.industries||[]).map(i=>i.name)))];
    const sel = document.getElementById('newsIndustry');
    if (sel.options.length <= 1) populateSelect('newsIndustry', inds);
  }
  function filterNews() {
    const src = document.getElementById('newsSource').value;
    const ind = document.getElementById('newsIndustry').value;
    const spec = document.getElementById('newsSpecial').checked;
    let days = data.days;
    if (src !== 'all') days = days.filter(d => d.source === src);
    if (spec) days = days.filter(d => d.special_count > 0);
    document.getElementById('newsContainer').innerHTML = days.map(day => {
      let industries = day.industries || [];
      if (ind !== 'all') industries = industries.filter(i => i.name === ind);
      if (!industries.length) return '';
      return `<div class="news-day">
        <div class="date">📺 ${day.date.replace(/(\d{4})(\d{2})(\d{2})/,'$1年$2月$3日')}
          <span class="meta">${day.total_items}条 · ${day.industry_count}个行业 ${day.special_count>0?' 🔔'+day.special_count+'条特别关注':''}</span>
        </div>
        ${industries.map(ind2 => `
          <div class="news-industry">
            <div class="ind-title">📌 ${ind2.name} <span class="count">${ind2.count}条${ind2.special?' 🔔':''}</span></div>
            ${(ind2.items||[]).map(item => `
              <div class="news-item" onclick="this.classList.toggle('expanded')">
                <div class="title">${item.title||''}${item.special?'<span class="spec-tag">🔔 特别关注</span>':''}</div>
                <div class="summary">${item.summary||''}</div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }
  if (!window._newsListenersAttached) {
    ['newsSource','newsIndustry'].forEach(id => { document.getElementById(id).addEventListener('change', filterNews); });
    document.getElementById('newsSpecial').addEventListener('change', filterNews);
    window._newsListenersAttached = true;
  }
  filterNews();
}

// ══════════════════════════════════════════════════════════════════
// SKILLS
// ══════════════════════════════════════════════════════════════════
function renderSkills() {
  const scene = document.getElementById('sfScene').value;
  let list = state.skills;
  if (scene !== 'all') list = list.filter(s => s.scene === scene);
  document.getElementById('skillsContainer').innerHTML = list.map(s => `
    <div class="skill-card">
      <div class="name">${s.name}</div>
      <div class="tags" style="margin:2px 0"><span class="tag">${s.scene==='work'?'工作':s.scene==='life'?'生活':'研究'}</span></div>
      <div class="desc">${s.desc}</div>
      <div class="reason">💡 <strong>推荐理由：</strong>${s.reason}</div>
    </div>
  `).join('');
}
document.getElementById('sfScene')?.addEventListener('change', renderSkills);

// ══════════════════════════════════════════════════════════════════
// SEARCH - 全局搜索
// ══════════════════════════════════════════════════════════════════
function highlight(text, query) {
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(q, 'gi'), m => `<em>${m}</em>`);
}

function doSearch(query) {
  const panel = document.getElementById('searchPanel');
  if (!query || query.trim().length < 1) {
    panel.classList.remove('show');
    panel.innerHTML = '';
    return;
  }
  const q = query.trim().toLowerCase();
  const results = { robot: [], model: [], news: [], skill: [] };

  // Search robots: 厂商, 型号, 类型_一级, 类型_二级
  (state.robots || []).forEach(r => {
    const fields = [r['厂商'], r['型号'], r['类型_一级'], r['类型_二级']].filter(Boolean);
    if (fields.some(f => f.toLowerCase().includes(q))) {
      results.robot.push({
        title: `${r['厂商']} ${r['型号']}`,
        subtitle: r['类型_一级'] || '',
        data: r
      });
    }
  });

  // Search models: model_name, vendor, capability_type
  (state.models || []).forEach(m => {
    const fields = [m.model_name, m.vendor, m.capability_type].filter(Boolean);
    if (fields.some(f => f.toLowerCase().includes(q))) {
      results.model.push({
        title: m.model_name,
        subtitle: m.vendor || '',
        data: m
      });
    }
  });

  // Search news (xwlb): items title + summary
  const days = state.news.days || [];
  days.forEach(day => {
    (day.industries || []).forEach(ind => {
      (ind.items || []).forEach(item => {
        const title = item.title || '';
        const summary = item.summary || '';
        if (title.toLowerCase().includes(q) || summary.toLowerCase().includes(q)) {
          const dateStr = (day.date || '').replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
          results.news.push({
            title: title,
            subtitle: `${dateStr} · ${ind.name}`,
            data: item
          });
        }
      });
    });
  });

  // Search skills: name, desc
  (state.skills || []).forEach(s => {
    if ((s.name || '').toLowerCase().includes(q) || (s.desc || '').toLowerCase().includes(q)) {
      results.skill.push({
        title: s.name,
        subtitle: s.scene === 'work' ? '工作' : s.scene === 'life' ? '生活' : '研究',
        data: s
      });
    }
  });

  const total = results.robot.length + results.model.length + results.news.length + results.skill.length;
  if (total === 0) {
    panel.innerHTML = '<div class="sp-empty">没有找到 "<strong>' + query.trim() + '</strong>" 相关内容</div>';
    panel.classList.add('show');
    return;
  }

  // Group labels & limits
  const groups = [
    { key: 'robot', label: '机器人', tag: '机器人', cls: 'sp-tag-robot', tab: 'robots', limit: 5 },
    { key: 'model', label: '模型', tag: '模型', cls: 'sp-tag-model', tab: 'models', limit: 5 },
    { key: 'news', label: '新闻', tag: '新闻', cls: 'sp-tag-news', tab: 'news', limit: 5 },
    { key: 'skill', label: '技能', tag: '技能', cls: 'sp-tag-skill', tab: 'skills', limit: 5 },
  ];

  let html = '';
  groups.forEach(g => {
    const items = results[g.key];
    if (!items.length) return;
    html += '<div class="sp-group">';
    html += `<div class="sp-header"><span class="sp-badge ${g.cls}">${g.tag}</span> ${items.length}条</div>`;
    items.slice(0, g.limit).forEach(item => {
      const titleHtml = highlight(item.title, query.trim());
      html += `<div class="sp-item" data-tab="${g.tab}" onclick="switchToTab('${g.tab}')">
        <span class="sp-tag ${g.cls}">${g.tag}</span>
        <span class="sp-title">${titleHtml}</span>
        <span class="sp-source">${item.subtitle ? highlight(item.subtitle, query.trim()) : ''}</span>
      </div>`;
    });
    if (items.length > g.limit) {
      html += `<div class="sp-more" onclick="switchToTab('${g.tab}')">查看全部 ${items.length} 条 ›</div>`;
    }
    html += '</div>';
  });

  panel.innerHTML = html;
  panel.classList.add('show');
}

function switchToTab(tabName) {
  document.getElementById('searchPanel').classList.remove('show');
  const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  if (btn) btn.click();
}

// Search input debounce
let searchTimer = null;
document.getElementById('globalSearch').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(this.value), 250);
});

// ESC关闭面板
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('searchPanel').classList.remove('show');
  }
});

// 点击外部关闭面板
document.addEventListener('click', e => {
  const panel = document.getElementById('searchPanel');
  const input = document.getElementById('globalSearch');
  if (!input.contains(e.target) && !panel.contains(e.target)) {
    panel.classList.remove('show');
  }
});

// ── START ──────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
