<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT · 行业动态</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: #131820;
    --border: #1e2736;
    --text: #c8d0e0;
    --dim: #6b7a99;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --green: #22c55e;
    --orange: #f59e0b;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 24px 32px 16px;
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,14,20,.92);
    backdrop-filter: blur(12px);
  }
  .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -.3px; }
  .header h1 span { color: var(--accent); }
  .header .sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .header .update-badge { font-size: 11px; color: var(--dim); float: right; margin-top: 6px; }

  /* Tabs */
  .tabs {
    display: flex; gap: 0;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    background: none; border: none; color: var(--dim);
    font-size: 14px; padding: 12px 20px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Main */
  .main { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-grid {
    display: grid;
    gap: 16px;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 28px; font-weight: 600; color: var(--accent);
  }
  .stat-card .label {
    font-size: 12px; color: var(--dim); margin-top: 4px;
  }

  /* Charts */
  .chart-container {
    position: relative;
    height: 220px;
    margin-top: 8px;
  }
  .chart-container.tall { height: 300px; }

  /* Item list */
  .item-list { list-style: none; }
  .item-list li {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .item-list li:last-child { border-bottom: none; }
  .item-list .item-title {
    font-size: 15px; font-weight: 500; color: var(--text);
    text-decoration: none;
  }
  .item-list .item-title:hover { color: var(--accent); }
  .item-list .item-meta {
    font-size: 12px; color: var(--dim); margin-top: 4px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .item-list .item-summary {
    font-size: 13px; color: #8896b0; margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Tags */
  .tag {
    display: inline-block;
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    font-weight: 500;
  }
  .tag-models { background: #1e3a5f; color: #60a5fa; }
  .tag-products { background: #1e3a2f; color: #4ade80; }
  .tag-industry { background: #3a2a1e; color: #fb923c; }
  .tag-paper { background: #2a1e3a; color: #a78bfa; }
  .tag-tip { background: #1e2a3a; color: #38bdf8; }
  .tag-other { background: var(--border); color: var(--dim); }

  /* Entity list */
  .entity-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
    gap: 10px;
  }
  .entity-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: all .2s;
  }
  .entity-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .entity-card .name { font-size: 14px; font-weight: 500; }
  .entity-card .meta { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; gap: 8px; }
  .entity-card .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: var(--border); color: var(--dim);
  }
  .entity-card .badge.company { background: #1e3a5f; color: #60a5fa; }
  .entity-card .badge.model { background: #2a1e3a; color: #a78bfa; }

  /* Search */
  .search-box {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--dim); }

  .search-category {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0;
  }
  .search-category button {
    background: var(--card); border: 1px solid var(--border);
    color: var(--dim); font-size: 12px; padding: 6px 14px;
    border-radius: 6px; cursor: pointer; transition: all .2s;
  }
  .search-category button:hover { border-color: var(--accent); color: var(--text); }
  .search-category button.active { border-color: var(--accent); background: #1e3a5f; color: var(--accent); }

  /* Modal overlay */
  .modal-overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    align-items: center; justify-content: center;
    overflow-y: auto; padding: 40px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 720px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    padding: 28px;
  }
  .modal h2 { font-size: 20px; margin-bottom: 4px; }
  .modal .close {
    float: right; background: none; border: none; color: var(--dim);
    font-size: 20px; cursor: pointer;
  }
  .modal .close:hover { color: var(--text); }
  .modal .entity-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    display: inline-block; margin-bottom: 16px;
  }
  .modal .tl-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .modal .tl-item:last-child { border-bottom: none; }
  .modal .tl-date { font-size: 11px; color: var(--dim); }
  .modal .tl-title { font-size: 14px; font-weight: 500; margin-top: 2px; }
  .modal .tl-summary { font-size: 13px; color: #8896b0; margin-top: 4px; }
  .modal .tl-url { font-size: 12px; color: var(--accent); text-decoration: none; display: inline-block; margin-top: 4px; }

  /* Filter bar */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .filter-bar button {
    background: var(--card); border: 1px solid var(--border);
    color: var(--dim); font-size: 12px; padding: 6px 14px;
    border-radius: 6px; cursor: pointer; transition: all .2s;
  }
  .filter-bar button:hover { border-color: var(--accent); color: var(--text); }
  .filter-bar button.active { border-color: var(--accent); background: #1e3a5f; color: var(--accent); }

  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 16px; }
    .tabs { padding: 0 16px; overflow-x: auto; }
    .tabs button { padding: 10px 14px; font-size: 13px; }
    .main { padding: 16px; }
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .entity-grid { grid-template-columns: repeat(2,1fr); }
    .chart-container { height: 180px; }
  }

  /* Loading */
  .loading { text-align: center; padding: 80px 0; color: var(--dim); }
  .loading .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .no-result { text-align: center; padding: 40px 0; color: var(--dim); font-size: 14px; }

  /* Source link */
  .source-link {
    font-size: 12px; color: var(--accent); text-decoration: none;
  }
  .source-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <div class="update-badge" id="updateBadge"></div>
  <h1>AI <span>HOT</span></h1>
  <div class="sub">AI 行业动态追踪 · 自动采集</div>
</div>

<div class="tabs">
  <button class="active" data-tab="dashboard">概览</button>
  <button data-tab="timeline">时间线</button>
  <button data-tab="entities">实体</button>
  <button data-tab="search">搜索</button>
</div>

<div class="main">

<!-- ====== DASHBOARD ====== -->
<div class="tab-content active" id="tab-dashboard">
  <div class="stats-row" id="statsCards"></div>

  <div class="card-grid" style="grid-template-columns: 1fr 1fr;">
    <div class="card">
      <h3 style="font-size:14px;font-weight:500;color:var(--dim);margin-bottom:8px;">📊 分类分布</h3>
      <div class="chart-container"><canvas id="chartCategory"></canvas></div>
    </div>
    <div class="card">
      <h3 style="font-size:14px;font-weight:500;color:var(--dim);margin-bottom:8px;">🏢 实体类型</h3>
      <div class="chart-container"><canvas id="chartEntityType"></canvas></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3 style="font-size:14px;font-weight:500;color:var(--dim);margin-bottom:8px;">📈 每日采集量</h3>
    <div class="chart-container tall"><canvas id="chartDaily"></canvas></div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3 style="font-size:14px;font-weight:500;color:var(--dim);margin-bottom:8px;">🏆 最活跃实体 TOP 10</h3>
    <div class="chart-container tall"><canvas id="chartTopEntities"></canvas></div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3 style="font-size:14px;font-weight:500;color:var(--dim);margin-bottom:8px;">📰 最新动态</h3>
    <ul class="item-list" id="recentItems"></ul>
  </div>
</div>

<!-- ====== TIMELINE ====== -->
<div class="tab-content" id="tab-timeline">
  <div class="filter-bar" id="categoryFilter"></div>
  <ul class="item-list" id="timelineItems"></ul>
  <div id="timelineLoading" class="loading">
    <div class="spinner"></div>
    <div>加载中…</div>
  </div>
</div>

<!-- ====== ENTITIES ====== -->
<div class="tab-content" id="tab-entities">
  <input class="search-box" id="entitySearch" placeholder="搜索实体…" oninput="filterEntities()">
  <div class="entity-grid" id="entityGrid"></div>
</div>

<!-- ====== SEARCH ====== -->
<div class="tab-content" id="tab-search">
  <input class="search-box" id="globalSearch" placeholder="搜索标题、摘要、来源…" oninput="doSearch()">
  <div class="search-category" id="searchCategory"></div>
  <ul class="item-list" id="searchResults"></ul>
</div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <span class="entity-badge" id="modalBadge"></span>
    <div id="modalTimeline"></div>
  </div>
</div>

<script>
// ── Data state ──
let items = [], entities = [], timelines = {}, stats = {};
const catLabels = { 'ai-models':'模型','ai-products':'产品','industry':'行业','paper':'论文','tip':'技巧','other':'其他' };
const catColors = { 'ai-models':'#60a5fa','ai-products':'#4ade80','industry':'#fb923c','paper':'#a78bfa','tip':'#38bdf8','other':'#6b7a99' };

// ── Init ──
Promise.all([
  fetch('items.json').then(r=>r.json()),
  fetch('entities.json').then(r=>r.json()),
  fetch('timelines.json').then(r=>r.json()),
  fetch('stats.json').then(r=>r.json()),
]).then(([i,e,t,s]) => {
  items=i; entities=e; timelines=t; stats=s;
  document.getElementById('updateBadge').textContent = '更新于 ' + (s.updated_at || '').slice(0,10);
  renderDashboard();
  renderTimeline();
  renderEntities();
  document.querySelectorAll('.timelineItems').length === 0 && initSearch();
  document.getElementById('timelineLoading').style.display = 'none';
}).catch(() => {
  document.querySelectorAll('.loading').forEach(el => el.innerHTML = '<div class="no-result">数据加载失败</div>');
});

// ── Tabs ──
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Dashboard ──
function renderDashboard() {
  const s = stats;
  document.getElementById('statsCards').innerHTML = `
    <div class="stat-card"><div class="num">${s.total_items}</div><div class="label">动态总数</div></div>
    <div class="stat-card"><div class="num">${s.total_entities}</div><div class="label">追踪实体</div></div>
    <div class="stat-card"><div class="num">${s.total_dailies}</div><div class="label">日报期数</div></div>
    <div class="stat-card"><div class="num">${Object.keys(s.categories||{}).length}</div><div class="label">分类数</div></div>
  `;

  // Category pie
  new Chart(document.getElementById('chartCategory'), {
    type: 'doughnut',
    data: {
      labels: Object.entries(s.categories||{}).map(([k,v]) => `${catLabels[k]||k} (${v})`),
      datasets: [{ data: Object.values(s.categories||{}), backgroundColor: Object.keys(s.categories||{}).map(k=>catColors[k]||'#6b7a99') }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#c8d0e0', font: {size:11} } } } }
  });

  // Entity type
  new Chart(document.getElementById('chartEntityType'), {
    type: 'doughnut',
    data: {
      labels: Object.entries(s.entity_types||{}).map(([k,v]) => `${k} (${v})`),
      datasets: [{ data: Object.values(s.entity_types||{}), backgroundColor: ['#60a5fa','#a78bfa','#38bdf8','#4ade80'] }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#c8d0e0', font: {size:11} } } } }
  });

  // Daily trend
  if (s.by_date && s.by_date.length) {
    new Chart(document.getElementById('chartDaily'), {
      type: 'bar',
      data: {
        labels: s.by_date.map(d => d.date.slice(5)),
        datasets: [{ label: '动态数', data: s.by_date.map(d => d.count), backgroundColor: '#3b82f680', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4 }]
      },
      options: { responsive: true, maintainAspectRatio: false,
        scales: { x: { ticks: { color: '#6b7a99', font: {size:11} }, grid: { color: '#1e2736' } },
                 y: { ticks: { color: '#6b7a99', font: {size:11} }, grid: { color: '#1e2736' } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // Top entities
  const top10 = entities.slice(0, 10).reverse();
  new Chart(document.getElementById('chartTopEntities'), {
    type: 'bar',
    data: {
      labels: top10.map(e => e.name),
      datasets: [{ label: '提及次数', data: top10.map(e => e.mentions),
        backgroundColor: top10.map(e => e.type === 'company' ? '#3b82f680' : '#a78bfa80'),
        borderColor: top10.map(e => e.type === 'company' ? '#3b82f6' : '#a78bfa'),
        borderWidth: 1, borderRadius: 4 }]
    },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      scales: { x: { ticks: { color: '#6b7a99', font: {size:11} }, grid: { color: '#1e2736' } },
               y: { ticks: { color: '#c8d0e0', font: {size:11} }, grid: { display: false } } },
      plugins: { legend: { display: false } }
    }
  });

  // Recent items
  const recent = items.slice(0, 15);
  document.getElementById('recentItems').innerHTML = recent.map(i => `
    <li>
      <div class="item-meta">
        <span class="tag tag-${i.category}">${catLabels[i.category]||i.category}</span>
        <span>${timeAgo(i.published_at)}</span>
        <span>${i.source||''}</span>
      </div>
      <a class="item-title" href="${i.url||'#'}" target="_blank" rel="noopener">${i.title}</a>
      ${i.summary ? `<div class="item-summary">${i.summary}</div>` : ''}
    </li>
  `).join('');
}

// ── Timeline ──
let timelineFilter = 'all';
function renderTimeline(filter) {
  if (filter !== undefined) timelineFilter = filter;
  const cats = [...new Set(items.map(i => i.category))];
  const catBtns = document.getElementById('categoryFilter');
  if (filter === undefined) {
    catBtns.innerHTML = '<button class="active" data-cat="all" onclick="renderTimeline(\'all\')">全部</button>' +
      cats.map(c => `<button data-cat="${c}" onclick="renderTimeline('${c}')">${catLabels[c]||c}</button>`).join('');
  } else {
    catBtns.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.cat === filter);
    });
  }
  const filtered = timelineFilter === 'all' ? items : items.filter(i => i.category === timelineFilter);
  document.getElementById('timelineItems').innerHTML = filtered.map(i => `
    <li>
      <div class="item-meta">
        <span class="tag tag-${i.category}">${catLabels[i.category]||i.category}</span>
        <span>${timeAgo(i.published_at)}</span>
        <span>${i.source||''}</span>
      </div>
      <a class="item-title" href="${i.url||'#'}" target="_blank" rel="noopener">${i.title}</a>
      ${i.summary ? `<div class="item-summary">${i.summary}</div>` : ''}
    </li>
  `).join('');
}

// ── Entities ──
function renderEntities() {
  document.getElementById('entityGrid').innerHTML = entities.map(e => `
    <div class="entity-card" onclick="openEntity('${e.name.replace(/'/g,"\\'")}')">
      <div class="name">${e.name}</div>
      <div class="meta">
        <span class="badge ${e.type}">${e.type}</span>
        <span>${e.mentions} 次提及</span>
      </div>
    </div>
  `).join('');
}
function filterEntities() {
  const q = document.getElementById('entitySearch').value.toLowerCase();
  document.querySelectorAll('.entity-card').forEach(el => {
    el.style.display = el.querySelector('.name').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

// ── Entity modal ──
function openEntity(name) {
  const tl = timelines[name] || [];
  document.getElementById('modalTitle').textContent = name;
  const ent = entities.find(e => e.name === name);
  document.getElementById('modalBadge').textContent = ent ? ent.type : '';
  document.getElementById('modalBadge').className = 'entity-badge ' + (ent ? ent.type : '');
  document.getElementById('modalTimeline').innerHTML = tl.length
    ? tl.map(i => `
      <div class="tl-item">
        <div class="tl-date">${timeAgo(i.published_at)} · ${catLabels[i.category]||i.category}</div>
        <div class="tl-title"><a href="${i.url||'#'}" target="_blank" style="color:inherit;text-decoration:none;">${i.title}</a></div>
        ${i.summary ? `<div class="tl-summary">${i.summary}</div>` : ''}
        ${i.url ? `<a class="tl-url" href="${i.url}" target="_blank">查看原文 →</a>` : ''}
      </div>
    `).join('')
    : '<div class="no-result">暂无相关动态</div>';
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ── Search ──
let searchFilter = 'all';
function initSearch() {
  const cats = [...new Set(items.map(i => i.category))];
  document.getElementById('searchCategory').innerHTML =
    '<button class="active" data-cat="all" onclick="setSearchCat(\'all\')">全部</button>' +
    cats.map(c => `<button data-cat="${c}" onclick="setSearchCat('${c}')">${catLabels[c]||c}</button>`).join('');
}
function setSearchCat(cat) {
  searchFilter = cat;
  document.querySelectorAll('#searchCategory button').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  doSearch();
}
function doSearch() {
  const q = document.getElementById('globalSearch').value.toLowerCase();
  const results = items.filter(i => {
    if (searchFilter !== 'all' && i.category !== searchFilter) return false;
    if (!q) return true;
    return (i.title||'').toLowerCase().includes(q) ||
           (i.summary||'').toLowerCase().includes(q) ||
           (i.source||'').toLowerCase().includes(q);
  }).slice(0, 100);
  document.getElementById('searchResults').innerHTML = results.length
    ? results.map(i => `
      <li>
        <div class="item-meta">
          <span class="tag tag-${i.category}">${catLabels[i.category]||i.category}</span>
          <span>${timeAgo(i.published_at)}</span>
          <span>${i.source||''}</span>
        </div>
        <a class="item-title" href="${i.url||'#'}" target="_blank" rel="noopener">${i.title}</a>
        ${i.summary ? `<div class="item-summary">${i.summary}</div>` : ''}
      </li>
    `).join('')
    : '<div class="no-result">无结果</div>';
}

// ── Helpers ──
function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  const now = new Date();
  const diff = (now - t) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  if (diff < 172800) return '昨天';
  if (diff < 2592000) return Math.floor(diff/86400) + '天前';
  return t.toISOString().slice(0,10);
}
